# Codecov configuration
# https://docs.codecov.com/docs/codecov-yaml

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto

# Copies of packages/shared/* source; coverage is credited to the canonical
# file under the route-snapshot (and any later shared) component instead.
ignore:
  # `**/*` compiles to `.*/[^/]*` and misses files directly in shared/
  - 'packages/*/src/shared/**'

# Bundle stats (apps' vite builds, ui-router-server entries, the docs worker).
# Informational while the new series baseline; the intent is to flip status to
# true (and require the check) once a few main commits establish the baseline.
bundle_analysis:
  warning_threshold: '5%'
  status: 'informational'

# Component definitions for monorepo packages
# https://docs.codecov.com/docs/components
component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
  individual_components:
    - component_id: lit-ui-router
      name: lit-ui-router
      paths:
        - packages/lit-ui-router/src/**
    - component_id: navigation-location-plugin
      name: navigation-location-plugin
      paths:
        - packages/navigation-location-plugin/src/**
    - component_id: lit-ui-router-effect
      name: lit-ui-router-effect
      paths:
        - packages/lit-ui-router-effect/src/**
    - component_id: lit-ui-router-ssr
      name: lit-ui-router-ssr
      paths:
        - packages/lit-ui-router-ssr/src/**
    - component_id: lit-ui-router-mobx
      name: lit-ui-router-mobx
      paths:
        - packages/lit-ui-router-mobx/src/**
    - component_id: ui-router-effect
      name: ui-router-effect
      paths:
        - packages/ui-router-effect/src/**
    - component_id: ui-router-server
      name: ui-router-server
      paths:
        - packages/ui-router-server/src/**
    - component_id: route-snapshot
      name: route-snapshot
      paths:
        - packages/shared/route-snapshot/src/**
