# Dependabot version updates https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # root pnpm workspace — npm ecosystem covers pnpm + catalogs
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    # Mirror pnpm's minimumReleaseAge: 24h (pnpm-workspace config)
    cooldown:
      default-days: 1
    ignore:
      # node is pinned via mise; keep @types/node on the matching major
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # vite majors change lockfile peer-keys, which the updater corrupts (dependabot-core#14794) — bump manually
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']
      # published floor stays >=0.50.0; the dev pin is the npm: alias in the catalog, which dependabot skips
      - dependency-name: '@oxc-project/runtime'
      # several catalogs pin typescript at different majors, so updates fail with NoChangeError — bump catalogs manually
      - dependency-name: 'typescript'
      # cf pins @cloudflare/config exactly; bumped apart they split and fail check:single-version, so bump both manually
      - dependency-name: 'cf'
      - dependency-name: '@cloudflare/config'
      # each release pins a Playwright minor, so it moves with playwright (repo-checks playwright-cli-pin.test.ts)
      - dependency-name: '@playwright/cli'
      # a Playwright minor needs the @playwright/cli release built against it, so minors move by hand; patches stay in range
      - dependency-name: 'playwright'
        update-types: ['version-update:semver-minor']
      - dependency-name: 'playwright-core'
        update-types: ['version-update:semver-minor']
      - dependency-name: '@playwright/test'
        update-types: ['version-update:semver-minor']
      # vite pins rolldown to a tilde range, so a rolldown minor waits for the vite release that adopts it
      - dependency-name: 'rolldown'
        update-types: ['version-update:semver-minor']
      # postcss-lit hands its babel 7 AST to postcss-lit-html, so babel 8 waits for a postcss-lit release on it
      - dependency-name: '@babel/parser'
        update-types: ['version-update:semver-major']
      - dependency-name: '@babel/types'
        update-types: ['version-update:semver-major']
      # typedoc and vitepress-plugin-llms pin markdown-it 14; md-content-mapper moves with them
      - dependency-name: 'markdown-it'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      # vitest and @vitest/* release in lockstep
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      # @distilled.cloud/cloudflare pins @distilled.cloud/core exactly, so both move together
      distilled:
        patterns:
          - '@distilled.cloud/*'
      # majors excluded — breaking changes get individual PRs
      minor-and-patch:
        patterns:
          - '*'
        exclude-patterns:
          - 'vitest'
          - '@vitest/*'
          - '@distilled.cloud/*'
        update-types:
          - 'minor'
          - 'patch'
      security:
        applies-to: security-updates
        patterns:
          - '*'

  # standalone StackBlitz examples — security updates only:
  # version-updates bump package.json without regenerating package-lock.json,
  # and no CI covers examples/, so broken PRs sail through green
  - package-ecosystem: 'npm'
    directories:
      - '/examples/*'
    schedule:
      interval: 'weekly'
    # 0 disables version updates; security updates (and their grouping) still apply
    open-pull-requests-limit: 0
    cooldown:
      default-days: 1
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      # batch security PRs across the three example lockfiles
      examples-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    # github-actions cooldown supports default-days only
    cooldown:
      default-days: 1
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      actions-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
