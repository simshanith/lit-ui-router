# Acceptance checks: slower suites against the built site, outside build_and_test,
# so a red check never holds tag_push. Advisory on PRs (not a required check);
# on main, the commit's verdict. One job per suite, each named
# `acceptance (<suite>)`; the job's own check run is the signal (README badges
# read main's via shields' check-runs endpoint). Nothing here gates.
name: Acceptance

on:
  push:
    branches:
      - main
  pull_request:
  # Runs a suite against any ref; ci-main/ branches don't run it.
  workflow_dispatch:

# Standard husky CI setup: skip the prepare-script git-hook install on CI installs.
env:
  HUSKY: 0

# Every main commit needs its own verdict, so main groups per commit; other refs
# share one group and cancel superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  bench:
    # tinybench timings for ui-router-server (`bench`), rendered as the job
    # summary. No thresholds, so only a crashing bench turns it red.
    name: acceptance (bench)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.1
      - name: Install dependencies
        run: mise run setup
      - name: Bench
        # The builds it needs come from the remote cache. Same continue-on-error
        # hand-off to the summary step as build-test-run.yml.
        id: bench
        continue-on-error: true
        run: mise run bench_pulse
        env:
          TURBO_OUTPUT_LOGS: errors-only
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
          TURBO_API: ${{ secrets.TURBO_API }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      - name: Bench summary
        # After a crash too: it reports whichever result file was written.
        if: ${{ !cancelled() }}
        run: mise run //tools/build_and_test:bench_summary
      - name: Upload turbo run summaries
        # Same fail-open uploads as build-test-run.yml; the report links both.
        id: run_summaries
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: turbo-run-summaries-bench
          path: .turbo/runs/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload turbo task logs
        # The benches are uncached, so this is the only record of their tables.
        id: task_logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: turbo-task-logs-bench
          path: |
            .turbo/turbo-*.log
            .turbo/logs/*.json
            apps/*/.turbo/turbo-*.log
            examples/.turbo/turbo-*.log
            packages/*/.turbo/turbo-*.log
            tools/*/.turbo/turbo-*.log
            www/*/.turbo/turbo-*.log
          include-hidden-files: true
          retention-days: 5
          if-no-files-found: warn
      - name: Turbo run summary
        # Goes red after a crashed bench, so a red job opens on the report.
        if: ${{ !cancelled() }}
        run: mise run //tools/build_and_test:turbo_summary
        env:
          BUILD_OUTCOME: ${{ steps.bench.outcome }}
          TURBO_SUMMARY_ARTIFACT_URL: ${{ steps.run_summaries.outputs.artifact-url }}
          TURBO_LOGS_ARTIFACT_URL: ${{ steps.task_logs.outputs.artifact-url }}

  a11y:
    # axe-core over the docs pages and sample-app mounts (`test:e2e:a11y`),
    # served by `wrangler dev`.
    name: acceptance (a11y)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.1
      - name: Install dependencies
        run: mise run setup
      - name: Resolve Playwright version
        id: playwright-version
        run: mise run //tools/build_and_test:playwright_version
      - name: Cache Playwright browsers
        # Same key as build-test-run.yml, so the two share one cache entry.
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ steps.playwright-version.outputs.image }}-playwright-${{ steps.playwright-version.outputs.playwright }}
      - name: Install Playwright Browsers
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
        run: mise run //tools/build_and_test:playwright
      - name: Mark summary session
        # Bounds the report below to this job's runs: the docs build and the suite.
        run: mise run //tools/build_and_test:mark_session
      - name: Axe
        # Same continue-on-error hand-off to the summary step as build-test-run.yml.
        id: axe
        continue-on-error: true
        run: mise run test_e2e a11y
        env:
          # Only failing tasks print; every task's full log is uploaded below.
          TURBO_OUTPUT_LOGS: errors-only
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
          TURBO_API: ${{ secrets.TURBO_API }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          # Silence per-request [wrangler:info] logging from the e2e dev server.
          WRANGLER_LOG: warn
      - name: Upload turbo run summaries
        # Same fail-open uploads as build-test-run.yml; the report links both.
        id: run_summaries
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: turbo-run-summaries-a11y
          path: .turbo/runs/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload turbo task logs
        # The suite is uncached, so this is the only record of a green run's scans.
        id: task_logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: turbo-task-logs-a11y
          path: |
            .turbo/turbo-*.log
            .turbo/logs/*.json
            apps/*/.turbo/turbo-*.log
            examples/.turbo/turbo-*.log
            packages/*/.turbo/turbo-*.log
            tools/*/.turbo/turbo-*.log
            www/*/.turbo/turbo-*.log
          include-hidden-files: true
          retention-days: 5
          if-no-files-found: warn
      - name: Upload axe screenshots
        # The Axe step continues on error, so `failure()` is false here.
        id: a11y_screenshots
        if: ${{ !cancelled() && steps.axe.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: axe-screenshots-a11y
          path: apps/sample-app-lit-e2e/a11y-screenshots/
          retention-days: 5
          if-no-files-found: ignore
      - name: Turbo run summary
        # Goes red after a failed suite, so a red job opens on the report.
        if: ${{ !cancelled() }}
        run: mise run //tools/build_and_test:turbo_summary
        env:
          BUILD_OUTCOME: ${{ steps.axe.outcome }}
          TURBO_SUMMARY_ARTIFACT_URL: ${{ steps.run_summaries.outputs.artifact-url }}
          TURBO_LOGS_ARTIFACT_URL: ${{ steps.task_logs.outputs.artifact-url }}
          # Empty on a green run or when no scan found a violation.
          A11Y_SCREENSHOTS_ARTIFACT_URL: ${{ steps.a11y_screenshots.outputs.artifact-url }}
      - name: Upload wrangler logs
        # Same crash-log capture as build-test-run.yml.
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: wrangler-logs-a11y
          path: ~/.config/.wrangler/logs/
          retention-days: 5
          if-no-files-found: warn
