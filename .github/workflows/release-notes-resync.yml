# Publishes CHANGELOG.md sections to the GitHub releases whose notes differ,
# file to GitHub only. Maintainer-dispatched; a dry run unless dry_run is
# unticked. The logic lives in tools/release (mise task
# //tools/release:notes_resync): it edits only the notes of existing stable
# releases that have a section, pins the Latest marker as it was, and lists
# every change with its diff in the job summary.
name: Release notes re-sync

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Published package name, or all'
        required: true
        default: all
        type: string
      version:
        description: 'Stable version, or all that differ'
        required: true
        default: all
        type: string
      dry_run:
        description: 'Dry run: list the edits and their diffs without making them'
        required: true
        default: true
        type: boolean

permissions: {}

# Standard husky CI setup: skip the prepare-script git-hook install on CI installs.
env:
  HUSKY: 0

# One re-sync at a time; a queued run re-reads GitHub when it starts.
concurrency:
  group: release-notes-resync
  cancel-in-progress: false

jobs:
  resync:
    name: release notes re-sync
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write # gh release edit
    steps:
      # Writes publish main's files only; a dry run may preview any branch.
      - name: Refuse writes off main
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::a re-sync that edits releases runs from main only"
          exit 1
      - name: 'Checkout code'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@v5
        with:
          # No restored tool cache: this job holds a token that edits releases.
          cache: false
      - name: Install dependencies
        run: mise run setup --release
      - name: Re-sync release notes
        run: mise run //tools/release:notes_resync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
