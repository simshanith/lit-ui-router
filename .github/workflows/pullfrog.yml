# Runs Pullfrog (https://docs.pullfrog.com) agent reviews. Pullfrog's GitHub
# App dispatches this workflow from the default branch with the prompt for the
# PR or comment it is answering, so the `prompt`/`name` inputs are its contract.
#
# One provider key reaches the job, and the model is set here, so only the
# free OpenCode Zen model can run. The console's repo model must stay
# "Custom (set in workflow)": a model stored there beats the `model` input.
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name

permissions: {}

jobs:
  pullfrog:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      # The action mints its own short-lived GitHub token over OIDC
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run agent
        uses: pullfrog/pullfrog@0741f79ecebfa4469a010644d2aed2d96d32d489 # v0.1.127
        with:
          prompt: ${{ inputs.prompt }}
          model: opencode/deepseek-v4.1-flash-free
          push: disabled
          timeout: 20m
        env:
          # The only provider key; a second one is a later rollout phase
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
