# The axe pass over the docs site and sample apps (`test:e2e:a11y`), for the main
# graph only: main pushes and mainGraph dispatches (build-test.yml) and `ci-main/`
# branches (build-test-branch.yml). Off the PR lane, where it cost every e2e
# suite its runner share (#1172, #1188). A job beside build_and_test, so a
# violation reds the commit without gating tag_push.
name: Accessibility (run)

on:
  workflow_call:
    secrets:
      TURBO_TOKEN:
        required: false
      TURBO_REMOTE_CACHE_SIGNATURE_KEY:
        required: false
      TURBO_API:
        required: false

env:
  HUSKY: 0

jobs:
  run:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.1
      - name: Install dependencies
        run: mise run setup
      - name: Resolve Playwright version
        id: playwright-version
        run: mise run //tools/build_and_test:playwright_version
      - name: Cache Playwright browsers
        # Same key as build-test-run.yml, so the two share one cache entry.
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ steps.playwright-version.outputs.image }}-playwright-${{ steps.playwright-version.outputs.playwright }}
      - name: Install Playwright Browsers
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
        run: mise run //tools/build_and_test:playwright
      - name: Axe
        run: mise run test_e2e a11y
        env:
          TURBO_OUTPUT_LOGS: errors-only
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
          TURBO_API: ${{ secrets.TURBO_API }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          WRANGLER_LOG: warn
