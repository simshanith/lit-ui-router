# Mirrors each successful Workers Builds preview build as a GitHub Deployment
# in the `preview/<worker>` environment, so a PR names its commit preview URL
# in the deployments box. The Cloudflare app reports only a check run and a
# comment; tools/workers-builds/preview-deployment.ts looks the URL up by
# build. A workflow of its own: the trigger is the app's check run, which no
# existing workflow listens for.
name: Preview deployments

on:
  # Runs the default branch's copy of this file; the event payload names the PR commit.
  check_run:
    types:
      - completed

permissions: {}

jobs:
  deployment:
    name: preview deployment
    if: >-
      github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
      github.event.check_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      checks: read
      contents: read # checkout of main's tools
      deployments: write
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v7
        with:
          # The tool's code, never the PR head's.
          ref: main
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@v5
        with:
          auto_update: true
      # @tools/workers-builds is in the release closure through @tools/release.
      - name: Install dependencies
        run: mise run setup --release
      - name: Post preview deployment
        run: mise run //tools/workers-builds:preview_deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DETAILS_URL: ${{ github.event.check_run.details_url }}
          HEAD_SHA: ${{ github.event.check_run.head_sha }}
