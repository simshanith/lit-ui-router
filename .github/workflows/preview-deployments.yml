# Mirrors each successful Workers Builds preview build as a GitHub Deployment
# in the `preview/<worker>` environment, so a PR names its commit preview URL
# in the deployments box, and retires a branch's deployments when its PR
# closes. tools/workers-builds/preview-deployment.ts reads the URL from the
# Cloudflare check run's summary. A workflow of its own: its triggers are the
# app's check run and a closed PR, which no existing workflow pairs with this.
name: Preview deployments

on:
  # Runs the default branch's copy of this file; the event payload names the PR commit.
  check_run:
    types:
      - completed
  # A second trigger, so a second job: a closed PR's previews go inactive.
  pull_request:
    types:
      - closed

permissions: {}

jobs:
  deployment:
    name: preview deployment
    if: >-
      github.event_name == 'check_run' &&
      github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
      startsWith(github.event.check_run.name, 'Workers Builds: ') &&
      github.event.check_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # One run per worker at a time; none cancelled, so every build posts and retires in order.
    concurrency:
      group: preview-deployment-${{ github.event.check_run.name }}
      cancel-in-progress: false
    permissions:
      contents: read # checkout of main's tools
      deployments: write
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v7
        with:
          # The tool's code, never the PR head's.
          ref: main
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@v5
        with:
          auto_update: true
      - name: Install dependencies
        run: mise run setup --filter '@tools/workers-builds...'
      - name: Post preview deployment
        run: mise run //tools/workers-builds:preview_deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_RUN_NAME: ${{ github.event.check_run.name }}
          HEAD_SHA: ${{ github.event.check_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.check_run.check_suite.head_branch }}
          CHECK_RUN_SUMMARY: ${{ github.event.check_run.output.summary }}
          DETAILS_URL: ${{ github.event.check_run.details_url }}

  retire:
    name: retire preview deployments
    # A fork's pull_request token is read-only; Workers Builds builds only this repo's branches.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout of main's tools
      deployments: write
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@v5
        with:
          auto_update: true
      - name: Install dependencies
        run: mise run setup --filter '@tools/workers-builds...'
      - name: Retire preview deployments
        run: mise run //tools/workers-builds:retire_preview_deployments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
