# Non-gating release signals on main's head, reported as check runs: the
# per-package "published-diff (<pkg>)" and "peer-floor (<pkg>)", plus the
# single "workers-builds (triggers)" (README badges read them all via shields'
# check-runs endpoint). All three answer "does the outside world still match
# main?" — npm artifacts, peer ranges, and the Cloudflare deploy pipeline that
# ships lit-ui-router.dev. One more, "pages-deploy (altitude-atlas)", sits on
# the www/atlas head instead and asks whether atlas.lit-ui-router.dev serves
# it. action_required renders orange = a release, a floor-bump, a dashboard
# apply, or an atlas deploy is owed; neutral renders grey = the check could not
# reach a verdict. Never a CI failure — both jobs succeed whatever the signals
# say.
name: Release signals

on:
  push:
    # A merge to main IS the CD event: Cloudflare Workers Builds deploys
    # lit-ui-router.dev on this same push, so the workers-builds signal
    # verifies the trigger config at the moment it gets used. Unfiltered by
    # paths — two API GETs, seconds.
    branches:
      - main
  # Secondary sweep: catches dashboard-side edits and npm-side changes (a
  # deprecate, an unpublish) during quiet periods, which no push would ever
  # surface. Off-peak and off the hour — the top of the hour is GitHub's most
  # congested cron slot.
  schedule:
    - cron: '17 7 * * 0'
  # Dispatched by publish-npm.yml after a successful publish: release-it
  # pushes the bump commit before npm `latest` moves, so the push-triggered
  # run sees stale drift; the post-publish run flips the badge green.
  workflow_dispatch:
    inputs:
      packages:
        description: 'Comma-separated published package names to re-check (re-nudge tool: a scoped run creates check runs only for these, so on a head with no prior full run the other badges show nothing until the next push/full run). Empty = all.'
        required: false
        default: ''
        type: string

# Standard husky CI setup: skip the prepare-script git-hook install on CI installs.
env:
  HUSKY: 0

# One refresh at a time, newest wins; every run targets main's current head.
concurrency:
  group: release-signals
  # The scheduled sweep is the one run that must never cancel: a cron firing
  # mid-publish would kill the post-publish dispatch whose whole job is
  # flipping the badges green. cancel-in-progress is read off the INCOMING
  # run, so a sweep queues behind whatever holds the group (and re-checks with
  # fresh data when it starts), while any later push/dispatch run still cancels
  # the queued sweep and does the same work.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  npm:
    name: release signals (npm)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      checks: write
      contents: read
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v7
        with:
          # Always main's head: the badges query main — filter=latest
          # supersedes stale same-name runs there.
          ref: main
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@v5
        with:
          auto_update: true
      - name: Install dependencies
        run: mise run setup --release
      - name: Published diff
        run: mise run //tools/release:published_diff
        env:
          # Empty on push, schedule, and post-publish runs = full set (the
          # empty string the tool treats as "all").
          PUBLISHED_DIFF_PACKAGES: ${{ inputs.packages }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
          TURBO_API: ${{ secrets.TURBO_API }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      - name: Publish check runs
        run: mise run //tools/release:publish_check_runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Tier-1 peer-floor signal: "peer-floor (<pkg>)" check runs, one per
      # package defining typecheck:peer-floor. action_required = the floor
      # pin is stale (release the peer, then bump the floor); never fails
      # this job. Reruns here flip green once the floor bump lands on main.
      - name: Peer floor check runs
        run: mise run //tools/release:peer_floor_check_runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
          TURBO_API: ${{ secrets.TURBO_API }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      - name: Upload turbo run summaries
        # Same fail-open uploads as build-test-run.yml; the report links both.
        id: run_summaries
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: turbo-run-summaries-release-signals
          path: .turbo/runs/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload turbo task logs
        id: task_logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: turbo-task-logs-release-signals
          path: |
            .turbo/turbo-*.log
            .turbo/logs/*.json
            apps/*/.turbo/turbo-*.log
            examples/.turbo/turbo-*.log
            packages/*/.turbo/turbo-*.log
            packages/shared/*/.turbo/turbo-*.log
            tools/*/.turbo/turbo-*.log
            www/lit-ui-router.dev/.turbo/turbo-*.log
            www/release-diffs.lit-ui-router.dev/.turbo/turbo-*.log
            www/release-ledger.lit-ui-router.dev/.turbo/turbo-*.log
          include-hidden-files: true
          retention-days: 5
          if-no-files-found: warn
      - name: Turbo run summary
        # Reports the published_diff runs; no BUILD_OUTCOME, since that step goes red itself.
        if: ${{ !cancelled() }}
        run: mise run //tools/build_and_test:turbo_summary
        env:
          # Presence only: the remote is off by design without a token (Dependabot, forks).
          TURBO_SUMMARY_TOKEN_SET: ${{ secrets.TURBO_TOKEN != '' }}
          TURBO_SUMMARY_ARTIFACT_URL: ${{ steps.run_summaries.outputs.artifact-url }}
          TURBO_LOGS_ARTIFACT_URL: ${{ steps.task_logs.outputs.artifact-url }}

  # Separate from npm so a crash there never skips the Cloudflare signals.
  cloudflare:
    name: release signals (cloudflare)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      checks: write
      contents: read
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v7
        with:
          # Always main's head, as in the npm job.
          ref: main
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@v5
        with:
          auto_update: true
      # The check scripts import @tools/shared and @tools/workers-builds, both in the release closure.
      - name: Install dependencies
        run: mise run setup --release
      # CD-pipeline signal (#280 Phase 1): the "workers-builds (triggers)"
      # check run. Read-only diff of the live Cloudflare Workers Builds
      # triggers against the repo-owned desired state — on a push to main it
      # verifies the deploy config against the very build that push kicked
      # off. Conclusions: success in sync, action_required on drift (the
      # dashboard owes a manual --apply), neutral when the check itself could
      # not run — a missing/expired token or a Cloudflare outage is an
      # observer failure, not evidence of drift, and must not share a colour
      # with it. Read scope only: CI never gets Edit, so #280's apply-on-merge
      # phase stays unimplemented. Exits 0 on every path.
      - name: Workers Builds trigger check run
        run: mise run //tools/release:workers_builds_check_runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Posts "pages-deploy (altitude-atlas)" on the www/atlas head; exits 0 on every path.
      - name: Pages deploy check run
        run: mise run //tools/release:pages_deploy_check_runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
