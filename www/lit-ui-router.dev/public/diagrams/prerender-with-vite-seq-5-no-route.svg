<svg viewBox="0 0 720 270" width="100%" style="max-width: 720px" role="img" aria-label="A listed path with no route fails the build: ui-router-server's prerender asks the route table for the verdict of /nowhere, a path in paths that no route and no otherwise rule claims. The verdict is no route, so the path lands in warnings and nothing is written. The result reaches serverRouterPlugin from lit-ui-router-ssr/vite, which throws, naming the path, and vite build fails." xmlns="http://www.w3.org/2000/svg">
