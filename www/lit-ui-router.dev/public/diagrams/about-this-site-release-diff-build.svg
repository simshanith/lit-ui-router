    <rect data-brand="cloudflare" x="568" y="6" width="124" height="26" rx="8" fill="var(--vp-c-bg-soft, #f6f6f7)" stroke="#f6821f" />
    <text x="630" y="23" font-size="12" font-weight="600" fill="var(--vp-c-text-1, #3c3c43)" text-anchor="middle">R2</text>
