<svg viewBox="0 0 720 508" width="100%" role="img" aria-label="Building one release diff. The diffs worker reads the pair's index.json from R2 and misses, so it calls build on the pair's ReleaseDiff object, which its name creates on first call and which runs one build at a time. The object reads index.json from R2 again and misses, fetches the packument and both tarballs from npm, unpacks and diffs them in memory, puts the patch and each preset's files in R2, then index.json last, and returns the index to the worker. Idle, it is evicted; it stores nothing." xmlns="http://www.w3.org/2000/svg">
  <title>Building one release diff: the ReleaseDiff object on a miss</title>
  <!-- dark palette applies only when this file is the document root -->
  <style>
    @media (prefers-color-scheme: dark) {
      svg:root {
        color-scheme: dark;
        --vp-c-bg: #1b1b1f;
        --vp-c-bg-soft: #202127;
        --vp-c-divider: #2e2e32;
        --vp-c-text-1: #dfdfd6;
        --vp-c-text-2: #98989f;
        --vp-c-brand-1: #29abe6;
        --vp-c-brand-soft: rgba(0, 152, 220, 0.16);
      }
    }
  </style>
  <defs>
    <marker id="arr-release-diff-build" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
