    <rect data-brand="cloudflare" x="28" y="6" width="124" height="26" rx="8" fill="var(--vp-c-bg-soft, #f6f6f7)" stroke="#f6821f" />
    <text x="90" y="23" font-size="12" font-weight="600" fill="var(--vp-c-text-1, #3c3c43)" text-anchor="middle">Diffs worker</text>
    <line x1="270" y1="32" x2="270" y2="504" stroke="var(--vp-c-divider, #e2e2e3)" />
    <rect data-brand="cloudflare" x="208" y="6" width="124" height="26" rx="8" fill="var(--vp-c-bg-soft, #f6f6f7)" stroke="#f6821f" />
    <text x="270" y="23" font-size="12" font-weight="600" fill="var(--vp-c-text-1, #3c3c43)" text-anchor="middle">ReleaseDiff</text>
