    <line x1="270" y1="242" x2="447" y2="242" stroke="var(--vp-c-text-2, #67676c)" stroke-width="1.25" marker-end="url(#arr-release-diff-build)" />
    <text x="360" y="236" font-size="11" fill="var(--vp-c-text-1, #3c3c43)" text-anchor="middle" stroke="var(--vp-c-bg, #ffffff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">packument</text>
    <line x1="450" y1="272" x2="273" y2="272" stroke="var(--vp-c-text-2, #67676c)" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#arr-release-diff-build)" />
    <text x="360" y="266" font-size="11" fill="var(--vp-c-text-1, #3c3c43)" text-anchor="middle" stroke="var(--vp-c-bg, #ffffff)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">tarball urls</text>
