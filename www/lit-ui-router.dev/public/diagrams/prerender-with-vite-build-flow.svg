<svg viewBox="0 0 720 318" width="100%" style="max-width: 720px" role="img" aria-label="Who owns what at build time. Vite runs the client build first and writes dist/, with assets/ and index.html. Then serverRouterPlugin, from ui-router-server, loads your src/prerender.ts and hands it site. Your script calls prerender() from lit-ui-router-ssr, which renders each page with Lit and hands the verdict work back to ui-router-server's prerender(), one page at a time. That prerender() asks your route table in src/routes.ts for a verdict per path and writes the files into dist/: index.html, about/index.html, 404.html and _redirects. A listed path no rule claims fails the build. ui-router-server never imports Lit; lit-ui-router-ssr owns the Lit render; your app owns the route table, the paths, the router and the page." xmlns="http://www.w3.org/2000/svg">
  <title>Who owns what at build time</title>
  <!-- dark palette applies only when this file is the document root -->
  <style>
    @media (prefers-color-scheme: dark) {
      svg:root {
        color-scheme: dark;
        --vp-c-bg-soft: #202127;
        --vp-c-divider: #2e2e32;
        --vp-c-text-1: #dfdfd6;
        --vp-c-text-2: #98989f;
        --vp-c-brand-1: #29abe6;
        --vp-c-brand-soft: rgba(0, 152, 220, 0.16);
        --vp-c-default-soft: rgba(101, 117, 133, 0.16);
        --vp-c-red-1: #f66f81;
        --vp-c-red-soft: rgba(244, 63, 94, 0.16);
      }
    }
  </style>
  <defs>
