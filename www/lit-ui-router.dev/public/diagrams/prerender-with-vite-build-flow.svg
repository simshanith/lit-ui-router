    <text x="194" y="54" font-size="10" fill="var(--vp-c-text-2, #67676c)">the plugin and the verdicts; no Lit</text>
    <rect x="370" y="14" width="24" height="24" rx="4" fill="var(--vp-c-default-soft, rgba(142,150,170,0.14))" />
    <svg x="374" y="18" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--vp-c-text-1, #3c3c43)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12.5 8 15l2 2.5" /><path d="m14 12.5 2 2.5-2 2.5" /><path d="M14 2v4a2 2 0 0 0 2 2h4" /><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z" /></svg>
    <text x="402" y="30" font-size="12" font-weight="600" fill="var(--vp-c-text-1, #3c3c43)">your app</text>
