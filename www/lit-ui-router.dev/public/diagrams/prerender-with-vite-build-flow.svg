    <text x="268" y="91" font-size="12" font-family="var(--vp-font-family-mono, ui-monospace, monospace)" fill="var(--vp-c-brand-1, #006a9a)" text-anchor="middle">serverRouterPlugin</text>
    <text x="268" y="109" font-size="11" fill="var(--vp-c-text-2, #67676c)" text-anchor="middle">loads the prerender script</text>
    <rect x="370" y="70" width="148" height="52" rx="8" fill="var(--vp-c-bg-soft, #f6f6f7)" stroke="var(--vp-c-divider, #e2e2e3)" />
    <text x="444" y="91" font-size="12" font-family="var(--vp-font-family-mono, ui-monospace, monospace)" fill="var(--vp-c-text-1, #3c3c43)" text-anchor="middle">src/prerender.ts</text>
    <text x="444" y="109" font-size="11" fill="var(--vp-c-text-2, #67676c)" text-anchor="middle">definePrerender(&#8230;)</text>
    <rect x="546" y="70" width="148" height="52" rx="8" fill="var(--vp-c-brand-soft, rgba(0,152,220,0.14))" stroke="var(--vp-c-brand-1, #006a9a)" />
    <text x="620" y="91" font-size="12" font-family="var(--vp-font-family-mono, ui-monospace, monospace)" fill="var(--vp-c-brand-1, #006a9a)" text-anchor="middle">prerender()</text>
    <text x="620" y="109" font-size="11" fill="var(--vp-c-text-2, #67676c)" text-anchor="middle">renders each page with Lit</text>
