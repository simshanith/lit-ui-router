    <svg data-brand="lit-ui-router" x="550" y="18" width="16" height="16" viewBox="0 0 800 800"><defs><linearGradient id="lur-pre-0" x1="-1117.68" y1="801.01" x2="-1116.68" y2="801.01" gradientTransform="scale(1123.68 -1123.68) rotate(-44.44 -1539.347 -967.69)" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0098dc" /><stop offset="1" stop-color="#ffe0a3" /></linearGradient></defs><path fill="url(#lur-pre-0)" fill-rule="evenodd" d="M147.89 4C68.2 4 3 69.2 3 148.89V651.6c0 79.7 65.2 144.9 144.89 144.9h502.72c79.69 0 144.88-65.2 144.88-144.9V148.89C795.49 69.2 730.3 4 650.61 4H147.89zm400 107-63 63v126l63-63v-126zm0 126v126l63-63v-126l-63 63zm63 63v126l63-63v-126l-63 63zm-126 0-63-63v126l63 63v-126zM200 505l-38 38v75l38-38v-75zm0 75v76l38-38v-76l-38 38zm38 38v75l38-38v-75l-38 38zm-76 0-37-38v76l37 38v-76zM400 505l-38 38v75l38-38v-75zm0 75v76l38-38v-76l-38 38zm38 38v75l38-38v-75l-38 38zm-76 0-37-38v76l37 38v-76zM600 505l-38 38v75l38-38v-75zm0 75v76l38-38v-76l-38 38zm38 38v75l38-38v-75l-38 38zm-76 0-37-38v76l37 38v-76z" /></svg>
