<svg viewBox="0 0 720 408" width="100%" style="max-width: 720px" role="img" aria-label="What is on screen at /galaxy/stars/sirius, in six numbered steps. 1: galaxy is entered. 2: galaxy.stars is entered and its stars resolve fetches the catalog. 3: galaxy.stars.star is entered and its star resolve finds Sirius in the inherited catalog. 4: the transition succeeds and galaxy-shell renders in the root ui-view inside app-root, with a nav whose Stars link stays active by inclusion. 5: stars-container renders in the shell's ui-view, with a star list of relative srefs where Sirius is the active row. 6: star-detail renders in the ui-view inside stars-container, which shows its slotted fallback when no child is active. The URL composes as /galaxy plus /stars plus /:starId, giving /galaxy/stars/sirius." xmlns="http://www.w3.org/2000/svg">
  <title>What renders at /galaxy/stars/sirius</title>
  <!-- dark palette applies only when this file is the document root -->
  <style>
    @media (prefers-color-scheme: dark) {
      svg:root {
        color-scheme: dark;
        --vp-c-bg: #1b1b1f;
        --vp-c-bg-soft: #202127;
        --vp-c-divider: #2e2e32;
        --vp-c-text-1: #dfdfd6;
        --vp-c-text-2: #98989f;
        --vp-c-brand-1: #29abe6;
        --vp-c-brand-soft: rgba(0, 152, 220, 0.16);
      }
    }
  </style>
  <g font-family="var(--vp-font-family-base, ui-sans-serif, system-ui, sans-serif)">
    <!-- root viewport -->
    <rect x="12" y="20" width="696" height="352" rx="8" fill="none" stroke="var(--vp-c-brand-1, #006a9a)" stroke-dasharray="5 4" />
    <rect x="20" y="26" width="66" height="16" rx="4" fill="var(--vp-c-brand-soft, rgba(0,152,220,0.14))" />
    <text x="53" y="38" font-size="10" font-family="var(--vp-font-family-mono, ui-monospace, monospace)" fill="var(--vp-c-brand-1, #006a9a)" text-anchor="middle">&lt;ui-view&gt;</text>
    <text x="94" y="38" font-size="10" fill="var(--vp-c-text-2, #67676c)">root viewport, in app-root</text>
    <!-- galaxy -->
    <rect x="24" y="50" width="672" height="310" rx="8" fill="var(--vp-c-bg-soft, #f6f6f7)" stroke="var(--vp-c-divider, #e2e2e3)" />
    <circle cx="44" cy="66" r="8" fill="var(--vp-c-brand-soft, rgba(0,152,220,0.14))" stroke="var(--vp-c-brand-1, #006a9a)" />
    <text x="44" y="69.5" font-size="10" font-weight="600" fill="var(--vp-c-brand-1, #006a9a)" text-anchor="middle">1</text>
    <text x="58" y="70" font-size="13" font-weight="600" fill="var(--vp-c-text-1, #3c3c43)">galaxy</text>
    <text x="116" y="70" font-size="10" fill="var(--vp-c-text-2, #67676c)">is entered</text>
    <text x="684" y="70" font-size="11" font-weight="600" font-family="var(--vp-font-family-mono, ui-monospace, monospace)" fill="var(--vp-c-brand-1, #006a9a)" text-anchor="end">/galaxy</text>
    <circle cx="44" cy="84" r="8" fill="var(--vp-c-brand-soft, rgba(0,152,220,0.14))" stroke="var(--vp-c-brand-1, #006a9a)" />
    <text x="44" y="87.5" font-size="10" font-weight="600" fill="var(--vp-c-brand-1, #006a9a)" text-anchor="middle">4</text>
    <text x="58" y="88" font-size="10"><tspan font-family="var(--vp-font-family-mono, ui-monospace, monospace)" fill="var(--vp-c-text-1, #3c3c43)">galaxy-shell</tspan><tspan fill="var(--vp-c-text-2, #67676c)"> renders in the root &lt;ui-view&gt; once the transition succeeds</tspan></text>
    <rect x="36" y="98" width="648" height="24" rx="4" fill="var(--vp-c-bg, #ffffff)" stroke="var(--vp-c-divider, #e2e2e3)" />
    <text x="44" y="114" font-size="11"><tspan fill="var(--vp-c-text-2, #67676c)">nav: </tspan><tspan font-weight="600" fill="var(--vp-c-brand-1, #006a9a)">Stars</tspan><tspan fill="var(--vp-c-text-2, #67676c)"> &#183; Astronaut &#8212; uiSrefActive matches by inclusion, so Stars stays active on the detail state</tspan></text>
    <!-- shell viewport -->
    <rect x="36" y="130" width="648" height="220" rx="8" fill="none" stroke="var(--vp-c-brand-1, #006a9a)" stroke-dasharray="5 4" />
    <rect x="44" y="136" width="66" height="16" rx="4" fill="var(--vp-c-brand-soft, rgba(0,152,220,0.14))" />
    <text x="77" y="148" font-size="10" font-family="var(--vp-font-family-mono, ui-monospace, monospace)" fill="var(--vp-c-brand-1, #006a9a)" text-anchor="middle">&lt;ui-view&gt;</text>
    <text x="118" y="148" font-size="10" fill="var(--vp-c-text-2, #67676c)">children of galaxy render here</text>
    <!-- galaxy.stars -->
    <rect x="48" y="158" width="624" height="182" rx="8" fill="var(--vp-c-bg-soft, #f6f6f7)" stroke="var(--vp-c-divider, #e2e2e3)" />
    <circle cx="68" cy="174" r="8" fill="var(--vp-c-brand-soft, rgba(0,152,220,0.14))" stroke="var(--vp-c-brand-1, #006a9a)" />
    <text x="68" y="177.5" font-size="10" font-weight="600" fill="var(--vp-c-brand-1, #006a9a)" text-anchor="middle">2</text>
    <text x="82" y="178" font-size="13" font-weight="600" fill="var(--vp-c-text-1, #3c3c43)">galaxy.stars</text>
    <text x="176" y="178" font-size="10" fill="var(--vp-c-text-2, #67676c)">is entered; its stars resolve fetches the catalog</text>
    <text x="660" y="178" font-size="11" font-family="var(--vp-font-family-mono, ui-monospace, monospace)" text-anchor="end"><tspan fill="var(--vp-c-text-2, #67676c)">/galaxy</tspan><tspan font-weight="600" fill="var(--vp-c-brand-1, #006a9a)"> + /stars</tspan></text>
    <circle cx="68" cy="192" r="8" fill="var(--vp-c-brand-soft, rgba(0,152,220,0.14))" stroke="var(--vp-c-brand-1, #006a9a)" />
    <text x="68" y="195.5" font-size="10" font-weight="600" fill="var(--vp-c-brand-1, #006a9a)" text-anchor="middle">5</text>
    <text x="82" y="196" font-size="10"><tspan font-family="var(--vp-font-family-mono, ui-monospace, monospace)" fill="var(--vp-c-text-1, #3c3c43)">stars-container</tspan><tspan fill="var(--vp-c-text-2, #67676c)"> renders in the shell's &lt;ui-view&gt;</tspan></text>
    <!-- list column -->
    <rect x="60" y="206" width="120" height="124" rx="8" fill="var(--vp-c-bg, #ffffff)" stroke="var(--vp-c-divider, #e2e2e3)" />
    <text x="70" y="223" font-size="10" font-weight="600" fill="var(--vp-c-text-2, #67676c)">star list</text>
    <text x="70" y="240" font-size="10" fill="var(--vp-c-text-2, #67676c)">Sun</text>
    <rect x="66" y="246" width="108" height="16" rx="4" fill="var(--vp-c-brand-soft, rgba(0,152,220,0.14))" />
    <text x="70" y="258" font-size="10" font-weight="600" fill="var(--vp-c-brand-1, #006a9a)">Sirius</text>
    <text x="70" y="276" font-size="10" fill="var(--vp-c-text-2, #67676c)">Vega &#8230;</text>
    <text x="70" y="300" font-size="10" font-family="var(--vp-font-family-mono, ui-monospace, monospace)" fill="var(--vp-c-text-2, #67676c)">uiSref('.star')</text>
    <text x="70" y="314" font-size="10" fill="var(--vp-c-text-2, #67676c)">relative sref</text>
    <!-- stars viewport -->
    <rect x="192" y="206" width="468" height="124" rx="8" fill="none" stroke="var(--vp-c-brand-1, #006a9a)" stroke-dasharray="5 4" />
    <rect x="200" y="212" width="66" height="16" rx="4" fill="var(--vp-c-brand-soft, rgba(0,152,220,0.14))" />
    <text x="233" y="224" font-size="10" font-family="var(--vp-font-family-mono, ui-monospace, monospace)" fill="var(--vp-c-brand-1, #006a9a)" text-anchor="middle">&lt;ui-view&gt;</text>
    <text x="274" y="224" font-size="10" fill="var(--vp-c-text-2, #67676c)">shows its slotted fallback when no child is active</text>
    <!-- galaxy.stars.star -->
    <rect x="204" y="234" width="444" height="88" rx="8" fill="var(--vp-c-bg-soft, #f6f6f7)" stroke="var(--vp-c-divider, #e2e2e3)" />
    <circle cx="224" cy="250" r="8" fill="var(--vp-c-brand-soft, rgba(0,152,220,0.14))" stroke="var(--vp-c-brand-1, #006a9a)" />
    <text x="224" y="253.5" font-size="10" font-weight="600" fill="var(--vp-c-brand-1, #006a9a)" text-anchor="middle">3</text>
    <text x="238" y="254" font-size="12" font-weight="600" fill="var(--vp-c-text-1, #3c3c43)">galaxy.stars.star</text>
    <text x="350" y="254" font-size="10" fill="var(--vp-c-text-2, #67676c)">is entered</text>
    <text x="636" y="254" font-size="11" font-family="var(--vp-font-family-mono, ui-monospace, monospace)" text-anchor="end"><tspan font-weight="600" fill="var(--vp-c-brand-1, #006a9a)">+ /:starId</tspan><tspan fill="var(--vp-c-text-2, #67676c)"> = sirius</tspan></text>
    <circle cx="224" cy="268" r="8" fill="var(--vp-c-brand-soft, rgba(0,152,220,0.14))" stroke="var(--vp-c-brand-1, #006a9a)" />
    <text x="224" y="271.5" font-size="10" font-weight="600" fill="var(--vp-c-brand-1, #006a9a)" text-anchor="middle">6</text>
    <text x="238" y="272" font-size="10"><tspan font-family="var(--vp-font-family-mono, ui-monospace, monospace)" fill="var(--vp-c-text-1, #3c3c43)">star-detail</tspan><tspan fill="var(--vp-c-text-2, #67676c)"> renders in the &lt;ui-view&gt; inside stars-container</tspan></text>
    <text x="238" y="292" font-size="10" fill="var(--vp-c-text-2, #67676c)">its star resolve reads :starId and finds Sirius in the inherited stars catalog</text>
    <text x="238" y="310" font-size="10"><tspan font-weight="600" fill="var(--vp-c-text-1, #3c3c43)">Sirius</tspan><tspan fill="var(--vp-c-text-2, #67676c)"> &#183; A1V &#183; Canis Major &#183; 8.6 ly</tspan></text>
    <!-- URL composition -->
    <text x="24" y="396" font-size="12" font-family="var(--vp-font-family-mono, ui-monospace, monospace)"><tspan fill="var(--vp-c-text-2, #67676c)">URLs compose:  </tspan><tspan fill="var(--vp-c-brand-1, #006a9a)">/galaxy</tspan><tspan fill="var(--vp-c-text-2, #67676c)"> + </tspan><tspan fill="var(--vp-c-brand-1, #006a9a)">/stars</tspan><tspan fill="var(--vp-c-text-2, #67676c)"> + </tspan><tspan fill="var(--vp-c-brand-1, #006a9a)">/:starId</tspan><tspan fill="var(--vp-c-text-2, #67676c)"> &#8594; </tspan><tspan font-weight="600" fill="var(--vp-c-text-1, #3c3c43)">/galaxy/stars/sirius</tspan></text>
  </g>
</svg>
