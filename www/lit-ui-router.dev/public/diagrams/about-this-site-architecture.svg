    <text x="246" y="114" font-size="11" fill="var(--vp-c-text-2, #67676c)">pages · 404.html</text>
    <circle cx="386" cy="66" r="9" fill="var(--vp-c-text-1, #3c3c43)" />
    <text x="386" y="69.5" font-size="10" font-weight="600" fill="var(--vp-c-bg, #ffffff)" text-anchor="middle">2</text>
    <!-- 3 docs worker -->
    <rect data-brand="cloudflare" x="236" y="200" width="152" height="60" rx="8" fill="var(--vp-c-bg-soft, #f6f6f7)" stroke="#f6821f" stroke-opacity="0.5" />
    <rect data-brand="cloudflare" x="246" y="210" width="24" height="24" rx="4" fill="#f6821f" fill-opacity="0.14" />
    <svg x="250" y="214" width="16" height="16" viewBox="0 0 24 24"><path data-brand="cloudflare" fill="#f6821f" d="m8.213.063 8.879 12.136-8.67 11.739h2.476l8.665-11.735-8.89-12.14Zm4.728 0 9.02 11.992-9.018 11.883h2.496L24 12.656v-1.199L15.434.063ZM7.178 2.02.01 11.398l-.01 1.2 7.203 9.644 1.238-1.676-6.396-8.556 6.361-8.313Z" /></svg>
    <text x="278" y="227" font-size="13" font-weight="600" fill="var(--vp-c-text-1, #3c3c43)">Docs worker</text>
    <text x="246" y="250" font-size="11" fill="var(--vp-c-text-2, #67676c)">verdicts · releases</text>
    <circle cx="386" cy="202" r="9" fill="var(--vp-c-text-1, #3c3c43)" />
    <text x="386" y="205.5" font-size="10" font-weight="600" fill="var(--vp-c-bg, #ffffff)" text-anchor="middle">3</text>
