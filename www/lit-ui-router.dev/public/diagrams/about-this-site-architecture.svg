    <text x="66" y="91" font-size="13" font-weight="600" fill="var(--vp-c-text-1, #3c3c43)">Readers</text>
    <text x="34" y="114" font-size="11" fill="var(--vp-c-text-2, #67676c)">browsers · badges</text>
    <circle cx="150" cy="66" r="9" fill="var(--vp-c-text-1, #3c3c43)" />
    <text x="150" y="69.5" font-size="10" font-weight="600" fill="var(--vp-c-bg, #ffffff)" text-anchor="middle">1</text>
    <!-- 2 static assets -->
    <rect data-brand="cloudflare" x="236" y="64" width="152" height="60" rx="8" fill="var(--vp-c-bg-soft, #f6f6f7)" stroke="#f6821f" stroke-opacity="0.5" />
    <rect data-brand="cloudflare" x="246" y="74" width="24" height="24" rx="4" fill="#f6821f" fill-opacity="0.14" />
