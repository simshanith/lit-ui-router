<svg viewBox="0 0 720 332" width="100%" style="max-width: 720px" role="img" aria-label="Architecture of lit-ui-router.dev. 1, readers, reach Cloudflare. 2, static assets, answer every path that is not worker-first. 3, the docs worker gets the worker-first paths: the sample apps, /releases and /gh; it fetches shells, 404 pages and pass-through requests from static assets, and reads the release ledger over RPC from 4, the ledger worker." xmlns="http://www.w3.org/2000/svg">
  <title>lit-ui-router.dev: static assets, the docs worker and the ledger worker</title>
