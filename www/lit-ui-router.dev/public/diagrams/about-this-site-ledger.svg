<svg viewBox="0 0 720 396" width="100%" style="max-width: 720px" role="img" aria-label="The release ledger. 1, GitHub, sends a claim with an Actions OIDC token after each npm publish to 3, the ledger worker, which also sweeps the release tags daily. It enqueues each claim on 4, Queues, takes claims back one at a time, observes GitHub and 2, npm, and is the only writer to 5, D1." xmlns="http://www.w3.org/2000/svg">
