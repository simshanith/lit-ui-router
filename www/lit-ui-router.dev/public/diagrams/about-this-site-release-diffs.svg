    <path d="M476 76V144" fill="none" stroke="var(--vp-c-text-2, #67676c)" stroke-width="1.25" marker-end="url(#arr-release-diffs)" />
    <text x="484" y="100" font-size="11" fill="var(--vp-c-text-2, #67676c)">packument · tarballs</text>
    <path d="M320 178H396" fill="none" stroke="var(--vp-c-text-2, #67676c)" stroke-width="1.25" marker-end="url(#arr-release-diffs)" />
    <text x="358" y="170" font-size="11" fill="var(--vp-c-text-2, #67676c)" text-anchor="middle">miss</text>
    <path d="M244 264V212" fill="none" stroke="var(--vp-c-text-2, #67676c)" stroke-width="1.25" marker-end="url(#arr-release-diffs)" />
    <text font-size="11" fill="var(--vp-c-text-2, #67676c)"><tspan x="252" y="232">read first: index.json,</tspan><tspan x="252" y="246">then patch or files</tspan></text>
    <path d="M476 208V264" fill="none" stroke="var(--vp-c-text-2, #67676c)" stroke-width="1.25" marker-end="url(#arr-release-diffs)" />
    <text font-size="11" fill="var(--vp-c-text-2, #67676c)"><tspan x="484" y="232">write once:</tspan><tspan x="484" y="246">index.json last</tspan></text>
    <!-- 1 npm -->
    <rect x="400" y="16" width="152" height="60" rx="8" fill="var(--vp-c-bg-soft, #f6f6f7)" stroke="var(--vp-c-divider, #e2e2e3)" />
    <rect data-brand="npm" x="410" y="26" width="24" height="24" rx="4" fill="#cb3837" fill-opacity="0.14" />
    <svg x="414" y="30" width="16" height="16" viewBox="0 0 24 24"><path data-brand="npm" fill="#cb3837" d="M1.763 0C.786 0 0 .786 0 1.763v20.474C0 23.214.786 24 1.763 24h20.474c.977 0 1.763-.786 1.763-1.763V1.763C24 .786 23.214 0 22.237 0zM5.13 5.323l13.837.019-.009 13.836h-3.464l.01-10.382h-3.456L12.04 19.17H5.113z" /></svg>
    <text x="442" y="43" font-size="13" font-weight="600" fill="var(--vp-c-text-1, #3c3c43)">npm</text>
    <text x="410" y="66" font-size="11" fill="var(--vp-c-text-2, #67676c)">registry</text>
    <circle cx="550" cy="18" r="9" fill="var(--vp-c-text-1, #3c3c43)" />
    <text x="550" y="21.5" font-size="10" font-weight="600" fill="var(--vp-c-bg, #ffffff)" text-anchor="middle">1</text>
    <!-- 2 release-diffs worker -->
    <rect data-brand="cloudflare" x="168" y="148" width="152" height="60" rx="8" fill="var(--vp-c-bg-soft, #f6f6f7)" stroke="#f6821f" stroke-opacity="0.5" />
    <rect data-brand="cloudflare" x="178" y="158" width="24" height="24" rx="4" fill="#f6821f" fill-opacity="0.14" />
    <svg x="182" y="162" width="16" height="16" viewBox="0 0 24 24"><path data-brand="cloudflare" fill="#f6821f" d="m8.213.063 8.879 12.136-8.67 11.739h2.476l8.665-11.735-8.89-12.14Zm4.728 0 9.02 11.992-9.018 11.883h2.496L24 12.656v-1.199L15.434.063ZM7.178 2.02.01 11.398l-.01 1.2 7.203 9.644 1.238-1.676-6.396-8.556 6.361-8.313Z" /></svg>
    <text x="210" y="175" font-size="13" font-weight="600" fill="var(--vp-c-text-1, #3c3c43)">Diffs worker</text>
    <text x="178" y="198" font-size="11" fill="var(--vp-c-text-2, #67676c)">index · files · patch</text>
    <circle cx="318" cy="150" r="9" fill="var(--vp-c-text-1, #3c3c43)" />
    <text x="318" y="153.5" font-size="10" font-weight="600" fill="var(--vp-c-bg, #ffffff)" text-anchor="middle">2</text>
    <!-- 3 ReleaseDiff object -->
    <rect data-brand="cloudflare" x="400" y="148" width="152" height="60" rx="8" fill="var(--vp-c-bg-soft, #f6f6f7)" stroke="#f6821f" stroke-opacity="0.5" />
    <rect data-brand="cloudflare" x="410" y="158" width="24" height="24" rx="4" fill="#f6821f" fill-opacity="0.14" />
    <svg data-brand="cloudflare" x="414" y="162" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f6821f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16ZM3.3 7l8.7 5 8.7-5M12 22V12" /></svg>
    <text x="442" y="175" font-size="13" font-weight="600" fill="var(--vp-c-text-1, #3c3c43)">ReleaseDiff</text>
    <text x="410" y="198" font-size="11" fill="var(--vp-c-text-2, #67676c)">one per pair</text>
    <circle cx="550" cy="150" r="9" fill="var(--vp-c-text-1, #3c3c43)" />
    <text x="550" y="153.5" font-size="10" font-weight="600" fill="var(--vp-c-bg, #ffffff)" text-anchor="middle">3</text>
    <!-- 4 R2 bucket -->
    <rect data-brand="cloudflare" x="168" y="268" width="384" height="76" rx="8" fill="var(--vp-c-bg-soft, #f6f6f7)" stroke="#f6821f" stroke-opacity="0.5" />
    <rect data-brand="cloudflare" x="178" y="278" width="24" height="24" rx="4" fill="#f6821f" fill-opacity="0.14" />
    <svg data-brand="cloudflare" x="182" y="282" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f6821f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="5" x="2" y="3" rx="1" /><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8M10 12h4" /></svg>
    <text x="210" y="295" font-size="13" font-weight="600" fill="var(--vp-c-text-1, #3c3c43)">R2 bucket</text>
    <text x="286" y="295" font-size="12" font-family="var(--vp-font-family-mono, ui-monospace, monospace)" fill="var(--vp-c-text-2, #67676c)">release-diffs</text>
    <text font-size="11" font-family="var(--vp-font-family-mono, ui-monospace, monospace)" fill="var(--vp-c-text-2, #67676c)"><tspan x="178" y="318">v1/&lt;pkg&gt;/&lt;from&gt;...&lt;to&gt;/</tspan><tspan x="194" y="334">patch · files/&lt;preset&gt; · index.json</tspan></text>
    <circle cx="550" cy="270" r="9" fill="var(--vp-c-text-1, #3c3c43)" />
    <text x="550" y="273.5" font-size="10" font-weight="600" fill="var(--vp-c-bg, #ffffff)" text-anchor="middle">4</text>
    <text x="136" y="398" font-size="11" font-weight="600" fill="var(--vp-c-text-2, #67676c)">release-diffs worker</text>
  </g>
</svg>
