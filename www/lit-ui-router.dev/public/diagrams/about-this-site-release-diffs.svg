    <rect x="590" y="64" width="118" height="60" rx="8" fill="var(--vp-c-bg-soft, #f6f6f7)" stroke="var(--vp-c-divider, #e2e2e3)" />
    <rect data-brand="npm" x="600" y="74" width="24" height="24" rx="4" fill="#cb3837" fill-opacity="0.14" />
    <svg x="604" y="78" width="16" height="16" viewBox="0 0 24 24"><path data-brand="npm" fill="#cb3837" d="M1.763 0C.786 0 0 .786 0 1.763v20.474C0 23.214.786 24 1.763 24h20.474c.977 0 1.763-.786 1.763-1.763V1.763C24 .786 23.214 0 22.237 0zM5.13 5.323l13.837.019-.009 13.836h-3.464l.01-10.382h-3.456L12.04 19.17H5.113z" /></svg>
    <text x="632" y="91" font-size="13" font-weight="600" fill="var(--vp-c-text-1, #3c3c43)">npm</text>
    <text x="600" y="114" font-size="11" fill="var(--vp-c-text-2, #67676c)">registry</text>
    <circle cx="706" cy="66" r="9" fill="var(--vp-c-text-1, #3c3c43)" />
    <text x="706" y="69.5" font-size="10" font-weight="600" fill="var(--vp-c-bg, #ffffff)" text-anchor="middle">5</text>
    <text x="4" y="332" font-size="11" font-weight="600" fill="var(--vp-c-text-2, #67676c)">release-diffs worker</text>
    <text x="716" y="332" font-size="10" fill="var(--vp-c-text-2, #67676c)" text-anchor="end">A Preview binds release-diffs-preview instead.</text>
  </g>
</svg>
