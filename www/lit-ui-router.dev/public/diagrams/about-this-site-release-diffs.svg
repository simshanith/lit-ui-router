<svg viewBox="0 0 720 408" width="100%" style="max-width: 720px" role="img" aria-label="The release-diffs worker. 1, npm, serves the packument and tarballs. 2, the release-diffs worker, answers index, files and patch by reading the pair's entry from 4, the R2 bucket, first. On a miss it asks 3, that pair's ReleaseDiff Durable Object, to build the entry: the object fetches the packument and both tarballs from npm and writes the patch and each preset's files to R2, then index.json last." xmlns="http://www.w3.org/2000/svg">
  <title>The release-diffs worker: R2 first, a ReleaseDiff object on a miss</title>
  <!-- dark palette applies only when this file is the document root -->
  <style>
    @media (prefers-color-scheme: dark) {
      svg:root {
        color-scheme: dark;
        --vp-c-bg: #1b1b1f;
        --vp-c-bg-soft: #202127;
        --vp-c-divider: #2e2e32;
        --vp-c-text-1: #dfdfd6;
        --vp-c-text-2: #98989f;
      }
    }
  </style>
  <defs>
    <marker id="arr-release-diffs" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L8 4L0 8z" fill="var(--vp-c-text-2, #67676c)" />
    </marker>
  </defs>
  <g font-family="var(--vp-font-family-base, ui-sans-serif, system-ui, sans-serif)">
