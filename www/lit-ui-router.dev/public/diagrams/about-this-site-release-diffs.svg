    <path d="M148 94H192" fill="none" stroke="var(--vp-c-text-2, #67676c)" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#arr-release-diffs)" />
    <text x="170" y="86" font-size="11" fill="var(--vp-c-text-2, #67676c)" text-anchor="middle">RPC</text>
    <path d="M364 94H412" fill="none" stroke="var(--vp-c-text-2, #67676c)" stroke-width="1.25" marker-end="url(#arr-release-diffs)" />
    <text x="388" y="86" font-size="11" fill="var(--vp-c-text-2, #67676c)" text-anchor="middle">miss</text>
    <path d="M540 94H586" fill="none" stroke="var(--vp-c-text-2, #67676c)" stroke-width="1.25" marker-end="url(#arr-release-diffs)" />
    <text x="563" y="86" font-size="11" fill="var(--vp-c-text-2, #67676c)" text-anchor="middle" stroke="var(--vp-c-bg, #ffffff)" stroke-width="4" paint-order="stroke">tarballs</text>
    <path d="M236 124V212" fill="none" stroke="var(--vp-c-text-2, #67676c)" stroke-width="1.25" marker-end="url(#arr-release-diffs)" />
    <text font-size="11" fill="var(--vp-c-text-2, #67676c)"><tspan x="244" y="164">read first:</tspan><tspan x="244" y="178">index.json, then</tspan><tspan x="244" y="192">patch or files</tspan></text>
    <path d="M478 124V212" fill="none" stroke="var(--vp-c-text-2, #67676c)" stroke-width="1.25" marker-end="url(#arr-release-diffs)" />
    <text font-size="11" fill="var(--vp-c-text-2, #67676c)" text-anchor="end"><tspan x="470" y="164">write once:</tspan><tspan x="470" y="178">patch, files,</tspan><tspan x="470" y="192">index.json last</tspan></text>
    <!-- 1 docs worker -->
    <rect data-brand="cloudflare" x="20" y="64" width="128" height="60" rx="8" fill="var(--vp-c-bg-soft, #f6f6f7)" stroke="#f6821f" stroke-opacity="0.5" />
    <rect data-brand="cloudflare" x="30" y="74" width="24" height="24" rx="4" fill="#f6821f" fill-opacity="0.14" />
    <svg x="34" y="78" width="16" height="16" viewBox="0 0 24 24"><path data-brand="cloudflare" fill="#f6821f" d="m8.213.063 8.879 12.136-8.67 11.739h2.476l8.665-11.735-8.89-12.14Zm4.728 0 9.02 11.992-9.018 11.883h2.496L24 12.656v-1.199L15.434.063ZM7.178 2.02.01 11.398l-.01 1.2 7.203 9.644 1.238-1.676-6.396-8.556 6.361-8.313Z" /></svg>
    <text x="62" y="91" font-size="13" font-weight="600" fill="var(--vp-c-text-1, #3c3c43)">Docs worker</text>
    <text x="30" y="114" font-size="11" fill="var(--vp-c-text-2, #67676c)">service binding</text>
    <circle cx="146" cy="66" r="9" fill="var(--vp-c-text-1, #3c3c43)" />
    <text x="146" y="69.5" font-size="10" font-weight="600" fill="var(--vp-c-bg, #ffffff)" text-anchor="middle">1</text>
    <!-- 2 release-diffs worker -->
    <rect data-brand="cloudflare" x="196" y="64" width="168" height="60" rx="8" fill="var(--vp-c-bg-soft, #f6f6f7)" stroke="#f6821f" stroke-opacity="0.5" />
    <rect data-brand="cloudflare" x="206" y="74" width="24" height="24" rx="4" fill="#f6821f" fill-opacity="0.14" />
    <svg x="210" y="78" width="16" height="16" viewBox="0 0 24 24"><path data-brand="cloudflare" fill="#f6821f" d="m8.213.063 8.879 12.136-8.67 11.739h2.476l8.665-11.735-8.89-12.14Zm4.728 0 9.02 11.992-9.018 11.883h2.496L24 12.656v-1.199L15.434.063ZM7.178 2.02.01 11.398l-.01 1.2 7.203 9.644 1.238-1.676-6.396-8.556 6.361-8.313Z" /></svg>
    <text x="238" y="91" font-size="13" font-weight="600" fill="var(--vp-c-text-1, #3c3c43)">Release-diffs</text>
    <text x="206" y="114" font-size="11" font-family="var(--vp-font-family-mono, ui-monospace, monospace)" fill="var(--vp-c-text-2, #67676c)">index · files · patch</text>
    <circle cx="362" cy="66" r="9" fill="var(--vp-c-text-1, #3c3c43)" />
    <text x="362" y="69.5" font-size="10" font-weight="600" fill="var(--vp-c-bg, #ffffff)" text-anchor="middle">2</text>
    <!-- 3 R2 bucket -->
    <rect data-brand="cloudflare" x="196" y="216" width="344" height="76" rx="8" fill="var(--vp-c-bg-soft, #f6f6f7)" stroke="#f6821f" stroke-opacity="0.5" />
    <rect data-brand="cloudflare" x="206" y="226" width="24" height="24" rx="4" fill="#f6821f" fill-opacity="0.14" />
    <svg data-brand="cloudflare" x="210" y="230" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f6821f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="5" x="2" y="3" rx="1" /><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8M10 12h4" /></svg>
    <text x="238" y="243" font-size="13" font-weight="600" fill="var(--vp-c-text-1, #3c3c43)">R2 bucket</text>
    <text x="314" y="243" font-size="12" font-family="var(--vp-font-family-mono, ui-monospace, monospace)" fill="var(--vp-c-text-2, #67676c)">release-diffs</text>
    <text font-size="11" font-family="var(--vp-font-family-mono, ui-monospace, monospace)" fill="var(--vp-c-text-2, #67676c)"><tspan x="206" y="266">v1/&lt;pkg&gt;/&lt;from&gt;...&lt;to&gt;/</tspan><tspan x="222" y="282">patch · files/&lt;preset&gt; · index.json</tspan></text>
    <circle cx="538" cy="218" r="9" fill="var(--vp-c-text-1, #3c3c43)" />
    <text x="538" y="221.5" font-size="10" font-weight="600" fill="var(--vp-c-bg, #ffffff)" text-anchor="middle">3</text>
    <!-- 4 ReleaseDiff object -->
    <rect data-brand="cloudflare" x="416" y="64" width="124" height="60" rx="8" fill="var(--vp-c-bg-soft, #f6f6f7)" stroke="#f6821f" stroke-opacity="0.5" />
    <rect data-brand="cloudflare" x="426" y="74" width="24" height="24" rx="4" fill="#f6821f" fill-opacity="0.14" />
    <svg data-brand="cloudflare" x="430" y="78" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f6821f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16ZM3.3 7l8.7 5 8.7-5M12 22V12" /></svg>
    <text x="458" y="91" font-size="13" font-weight="600" fill="var(--vp-c-text-1, #3c3c43)">ReleaseDiff</text>
    <text x="426" y="114" font-size="11" fill="var(--vp-c-text-2, #67676c)">one per pair</text>
    <circle cx="538" cy="66" r="9" fill="var(--vp-c-text-1, #3c3c43)" />
    <text x="538" y="69.5" font-size="10" font-weight="600" fill="var(--vp-c-bg, #ffffff)" text-anchor="middle">4</text>
