<svg viewBox="0 0 720 428" width="100%" role="img" aria-label="vite preview after the build: the plugin middleware runs first for every request. For /about the verdict is a page, so the request is rewritten to about/index.html and the file is served with 200. For /legacy the verdict is a redirect and the middleware answers 302 with Location /about itself, fetching no file. For /nowhere the otherwise rule gives a page with status 404, so the request is rewritten to 404.html and the file is served with status 404." xmlns="http://www.w3.org/2000/svg">
