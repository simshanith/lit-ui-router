<svg viewBox="0 0 720 256" width="100%" style="max-width: 720px" role="img" aria-label="The transition lifecycle: onBefore, onStart, onExit/onRetain/onEnter, onFinish, then onSuccess or onError. After onSuccess, the views render on the next Lit update. A route guard is an onBefore hook: returning a TargetState redirects, false cancels, nothing proceeds. Resolves fetch during the transition." xmlns="http://www.w3.org/2000/svg">
  <title>The transition lifecycle and where guards run</title>
  <!-- dark palette applies only when this file is the document root -->
  <style>
    @media (prefers-color-scheme: dark) {
      svg:root {
        color-scheme: dark;
        --vp-c-bg-soft: #202127;
        --vp-c-divider: #2e2e32;
        --vp-c-text-1: #dfdfd6;
        --vp-c-text-2: #98989f;
        --vp-c-brand-1: #a8b1ff;
        --vp-c-brand-soft: rgba(100, 108, 255, 0.16);
        --vp-c-green-1: #3dd68c;
        --vp-c-green-soft: rgba(16, 185, 129, 0.16);
        --vp-c-red-1: #f66f81;
        --vp-c-red-soft: rgba(244, 63, 94, 0.16);
      }
    }
  </style>
  <defs>
    <marker id="arr-lifecycle" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L8 4L0 8z" fill="var(--vp-c-text-2, #67676c)" />
    </marker>
  </defs>
  <g font-family="var(--vp-font-family-base, ui-sans-serif, system-ui, sans-serif)">
    <!-- chain -->
    <rect x="16" y="52" width="88" height="36" rx="8" fill="var(--vp-c-brand-soft, rgba(100,108,255,0.14))" stroke="var(--vp-c-brand-1, #3451b2)" />
    <text x="60" y="74" font-size="12" font-family="var(--vp-font-family-mono, ui-monospace, monospace)" fill="var(--vp-c-brand-1, #3451b2)" text-anchor="middle">onBefore</text>
    <line x1="104" y1="70" x2="118" y2="70" stroke="var(--vp-c-text-2, #67676c)" stroke-width="1.25" marker-end="url(#arr-lifecycle)" />
    <rect x="122" y="52" width="78" height="36" rx="8" fill="var(--vp-c-bg-soft, #f6f6f7)" stroke="var(--vp-c-divider, #e2e2e3)" />
    <text x="161" y="74" font-size="12" font-family="var(--vp-font-family-mono, ui-monospace, monospace)" fill="var(--vp-c-text-1, #3c3c43)" text-anchor="middle">onStart</text>
    <line x1="200" y1="70" x2="214" y2="70" stroke="var(--vp-c-text-2, #67676c)" stroke-width="1.25" marker-end="url(#arr-lifecycle)" />
    <rect x="218" y="52" width="186" height="36" rx="8" fill="var(--vp-c-bg-soft, #f6f6f7)" stroke="var(--vp-c-divider, #e2e2e3)" />
    <text x="311" y="74" font-size="11" font-family="var(--vp-font-family-mono, ui-monospace, monospace)" fill="var(--vp-c-text-1, #3c3c43)" text-anchor="middle">onExit &#183; onRetain &#183; onEnter</text>
    <line x1="404" y1="70" x2="418" y2="70" stroke="var(--vp-c-text-2, #67676c)" stroke-width="1.25" marker-end="url(#arr-lifecycle)" />
    <rect x="422" y="52" width="80" height="36" rx="8" fill="var(--vp-c-bg-soft, #f6f6f7)" stroke="var(--vp-c-divider, #e2e2e3)" />
    <text x="462" y="74" font-size="12" font-family="var(--vp-font-family-mono, ui-monospace, monospace)" fill="var(--vp-c-text-1, #3c3c43)" text-anchor="middle">onFinish</text>
    <!-- fork -->
    <line x1="502" y1="64" x2="540" y2="42" stroke="var(--vp-c-text-2, #67676c)" stroke-width="1.25" marker-end="url(#arr-lifecycle)" />
    <line x1="502" y1="76" x2="540" y2="98" stroke="var(--vp-c-text-2, #67676c)" stroke-width="1.25" marker-end="url(#arr-lifecycle)" />
    <rect x="546" y="20" width="90" height="36" rx="8" fill="var(--vp-c-green-soft, rgba(16,185,129,0.14))" />
    <text x="591" y="42" font-size="12" font-weight="600" font-family="var(--vp-font-family-mono, ui-monospace, monospace)" fill="var(--vp-c-green-1, #18794e)" text-anchor="middle">onSuccess</text>
    <rect x="546" y="84" width="90" height="36" rx="8" fill="var(--vp-c-red-soft, rgba(244,63,94,0.14))" />
    <text x="591" y="106" font-size="12" font-weight="600" font-family="var(--vp-font-family-mono, ui-monospace, monospace)" fill="var(--vp-c-red-1, #b8272c)" text-anchor="middle">onError</text>
    <!-- views render after onSuccess -->
    <line x1="636" y1="38" x2="650" y2="38" stroke="var(--vp-c-text-2, #67676c)" stroke-width="1.25" marker-end="url(#arr-lifecycle)" />
    <rect x="654" y="20" width="62" height="36" rx="8" fill="var(--vp-c-bg-soft, #f6f6f7)" stroke="var(--vp-c-divider, #e2e2e3)" />
    <text x="685" y="36" font-size="11" fill="var(--vp-c-text-1, #3c3c43)" text-anchor="middle">views</text>
    <text x="685" y="49" font-size="11" fill="var(--vp-c-text-1, #3c3c43)" text-anchor="middle">render</text>
    <text x="654" y="70" font-size="10" fill="var(--vp-c-text-2, #67676c)">on the next</text>
    <text x="654" y="82" font-size="10" fill="var(--vp-c-text-2, #67676c)">Lit update</text>
    <text x="642" y="106" font-size="10" fill="var(--vp-c-text-2, #67676c)">cancelled</text>
    <text x="642" y="118" font-size="10" fill="var(--vp-c-text-2, #67676c)">or failed</text>
    <!-- resolves bracket -->
    <line x1="122" y1="112" x2="122" y2="106" stroke="var(--vp-c-divider, #e2e2e3)" />
    <line x1="122" y1="112" x2="502" y2="112" stroke="var(--vp-c-divider, #e2e2e3)" />
    <line x1="502" y1="112" x2="502" y2="106" stroke="var(--vp-c-divider, #e2e2e3)" />
    <text x="312" y="130" font-size="11" fill="var(--vp-c-text-2, #67676c)" text-anchor="middle">resolves fetch during the transition &#8212; data arrives before any view renders</text>
    <!-- guard callout -->
    <line x1="60" y1="148" x2="60" y2="92" stroke="var(--vp-c-brand-1, #3451b2)" />
    <rect x="16" y="150" width="330" height="94" rx="8" fill="var(--vp-c-brand-soft, rgba(100,108,255,0.14))" stroke="var(--vp-c-brand-1, #3451b2)" />
    <text x="30" y="172" font-size="12" font-weight="600" fill="var(--vp-c-brand-1, #3451b2)">a route guard is an onBefore hook</text>
    <text x="30" y="188" font-size="10" font-family="var(--vp-font-family-mono, ui-monospace, monospace)" fill="var(--vp-c-text-2, #67676c)">criteria: { to: (s) =&gt; s.data.requiresAuth }</text>
    <text x="30" y="208" font-size="11" fill="var(--vp-c-text-1, #3c3c43)"><tspan font-family="var(--vp-font-family-mono, ui-monospace, monospace)">TargetState</tspan> &#8594; redirect (e.g. to login)</text>
    <text x="30" y="224" font-size="11" fill="var(--vp-c-text-1, #3c3c43)"><tspan font-family="var(--vp-font-family-mono, ui-monospace, monospace)">false</tspan> &#8594; cancel the transition</text>
    <text x="30" y="240" font-size="11" fill="var(--vp-c-text-1, #3c3c43)"><tspan font-family="var(--vp-font-family-mono, ui-monospace, monospace)">nothing</tspan> &#8594; proceed</text>
    <!-- async note -->
    <text x="368" y="208" font-size="10" fill="var(--vp-c-text-2, #67676c)">guards can be async &#8212; the transition</text>
    <text x="368" y="221" font-size="10" fill="var(--vp-c-text-2, #67676c)">waits for the returned Promise</text>
  </g>
</svg>
