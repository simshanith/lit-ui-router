<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- The location plugins read their base from here. %BASE_URL% is vite's
         html env replacement of `base`, which vite.config.ts derives from
         src/routes.ts's MOUNT — the one base constant. -->
    <base href="%BASE_URL%" />
    <title>The Altitude Atlas — Drawing Set</title>
    <meta
      name="description"
      content="The Altitude Atlas as a single-page drawing set: twenty-one sheets of the lit-ui-router codebase, routed with lit-ui-router."
    />
    <link rel="stylesheet" href="%BASE_URL%sheets/atlas.css" />
    <!-- THE TYPE, stand-in half. atlas.css names the Adobe family first in
         every role stack and the Google Fonts stand-in second; this link is
         the second half, and it is the ONLY half the claude.ai ARTIFACT can
         have (that host allows stylesheets from Google Fonts and nothing
         else), so the artifact keeps exactly these three links.
         On the SITE it is the other way round: generator/stage-site.mjs
         STRIPS these three links from the staged copy and injects the Adobe
         kit instead, so a staged page has one font host, not two.
         The prose is therefore Source Serif Pro from the kit on the site and
         Source Serif 4 from Google in the artifact — one design, two
         releases; the code face is the same deal, source-code-pro from the
         kit and Source Code Pro from Google, at the kit's own 400/700. The
         hand (--hand) asks Google for nothing: off the kit it falls to the
         data face. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600&family=Barlow+Semi+Condensed:wght@400;600&family=Source+Serif+4:ital,wght@0,400;1,400&family=Source+Code+Pro:wght@400;700&display=swap"
    />
    <style>
      /* The app chrome. Everything below leans on the tokens atlas.css
         declares, so the index reads as part of the drawing set. */
      /* the reset and the colour scheme are atlas.css's; this repeats its eases */
      :root {
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      }
      body {
        padding: 0;
        /* the inset strip clears the sticky utility bar */
        --sticky-top: 46px;
      }
      .app {
        display: grid;
        grid-template-columns: 240px minmax(0, 1fr);
        min-height: 100vh;
      }
      @media (max-width: 900px) {
        .app {
          grid-template-columns: 1fr;
        }
      }
      /* ---- the rail: the sheet list, and only that ---- */
      .rail {
        position: sticky;
        inset-block-start: 0;
        align-self: start;
        /* The paper box is the COLUMN, not the height of its links: without the
           min-height the ground shows under the last sheet on every page. */
        min-height: 100vh;
        max-height: 100vh;
        overflow-y: auto;
        background: var(--paper);
        border-inline-end: 1.5px solid var(--ink);
        padding-block: 14px 30px;
        padding-inline: 0;
      }
      .rail-head {
        padding-block: 6px 12px;
        padding-inline: 16px;
        border-block-end: 1.5px solid var(--ink);
        margin-block-end: 10px;
      }
      .rail-head .kicker {
        display: block;
        font-family: var(--data);
        font-size: 10px;
        letter-spacing: 0.14em;
        color: var(--ink-soft);
        text-decoration: none;
      }
      @media (hover: hover) and (pointer: fine) {
        .rail-head .kicker:hover {
          color: var(--accent);
          text-decoration: underline;
        }
      }
      .rail-head h1 {
        font-family: var(--display);
        font-size: 17px;
        letter-spacing: 0.14em;
        font-weight: 600;
        margin-block: 5px 0;
        margin-inline: 0;
      }
      .rail-head h1 a {
        color: inherit;
        text-decoration: none;
      }
      /* the ≤900 disclosure: a checkbox the label toggles, no script needed */
      .rail-open {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        overflow: clip;
      }
      .rail-toggle {
        display: none;
      }
      .rail-links {
        display: flex;
        flex-direction: column;
      }
      .rail-links a {
        display: flex;
        gap: 9px;
        align-items: baseline;
        font-family: var(--data);
        font-size: 11px;
        letter-spacing: 0.06em;
        text-decoration: none;
        color: var(--ink);
        padding: 6px 16px;
        border-inline-start: 3px solid transparent;
      }
      @media (hover: hover) and (pointer: fine) {
        .rail-links a:hover {
          background: var(--paper-2);
        }
      }
      .rail-links a.is-active {
        background: var(--paper-2);
        border-inline-start-color: var(--accent);
      }
      .rail-links .n {
        font-family: var(--data);
        color: var(--accent);
        font-weight: 600;
        min-width: 34px;
        font-variant-numeric: tabular-nums;
      }
      /* Entry titles take the sheet-title face at its only other weight; the
         active state is the bar and the tint, never a weight flip. */
      .rail-links .t {
        font-family: var(--title);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--ink);
      }
      .rail-sec {
        font-family: var(--data);
        font-size: 10px;
        letter-spacing: 0.14em;
        color: var(--ink-faint);
        padding-block: 14px 5px;
        padding-inline: 16px;
      }
      /* INDEX · ABOUT — one small line, not two sheet-sized entries */
      .rail-top {
        display: flex;
        gap: 0;
        padding: 0 16px;
      }
      .rail-top a {
        font-family: var(--data);
        font-size: 10px;
        letter-spacing: 0.14em;
        text-decoration: none;
        color: var(--ink-soft);
        padding: 4px 0;
      }
      .rail-top a + a::before {
        content: '·';
        color: var(--ink-faint);
        margin: 0 10px;
      }
      .rail-top a.is-active {
        color: var(--ink);
      }
      @media (hover: hover) and (pointer: fine) {
        .rail-top a:hover {
          color: var(--ink);
        }
      }
      .rail-top a.is-active {
        font-weight: 600;
      }
      /* ---- the rail's altitude bands: one native disclosure each ---- */
      .rail-band > summary {
        display: flex;
        gap: 9px;
        align-items: baseline;
        list-style: none;
        cursor: pointer;
        user-select: none;
        font-family: var(--data);
        font-size: 11px;
        letter-spacing: 0.06em;
        color: var(--ink-soft);
        padding-block: 8px 7px;
        padding-inline: 16px;
        border-inline-start: 3px solid transparent;
      }
      .rail-band > summary::-webkit-details-marker {
        display: none;
      }
      @media (hover: hover) and (pointer: fine) {
        .rail-band > summary:hover {
          background: var(--paper-2);
          color: var(--ink);
        }
      }
      .rail-band > summary:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .rail-band > summary .n {
        min-width: 34px;
        color: var(--accent);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      /* the same face as the entries beneath, so the rail reads in one voice */
      .rail-band > summary .t {
        flex: 1;
        font-family: var(--title);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      /* the caret: a drawn chevron, right when shut, down when open */
      .rail-band > summary::after {
        content: '';
        flex: none;
        align-self: center;
        width: 5px;
        height: 5px;
        border-right: 1.5px solid currentColor;
        border-bottom: 1.5px solid currentColor;
        transform: rotate(-45deg);
      }
      .rail-band[open] > summary {
        color: var(--ink);
      }
      .rail-band[open] > summary::after {
        transform: translateY(-2px) rotate(45deg);
      }
      /* a band's plates sit one step in, on a hairline the active bar overprints */
      .rail-band > .rail-links {
        margin-block: 0 6px;
        margin-inline: 19px 0;
        border-inline-start: 1px solid var(--line);
      }
      .rail-band > .rail-links a {
        margin-inline-start: -2px;
        padding-inline-start: 12px;
      }
      @media (prefers-reduced-motion: no-preference) {
        .rail-band > summary::after {
          transition: transform 120ms ease;
        }
      }
      @media (max-width: 900px) {
        .rail {
          z-index: 8;
          min-height: 0;
          max-height: none;
          overflow: visible;
          border-inline-end: none;
          border-block-end: 1.5px solid var(--ink);
          padding: 0;
        }
        .rail-head {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
          height: 48px;
          padding: 0 14px;
          margin: 0;
          border-block-end: none;
        }
        .rail-head .kicker {
          display: none;
        }
        .rail-head h1 {
          font-size: 15px;
          margin: 0;
        }
        .rail-toggle {
          display: inline-block;
          flex: 0 0 auto;
          font-family: var(--data);
          font-size: 10px;
          letter-spacing: 0.14em;
          color: var(--ink);
          border: 1px solid var(--ink);
          padding: 6px 10px;
          cursor: pointer;
          user-select: none;
        }
        .rail-open:focus-visible + .rail-head .rail-toggle {
          outline: max(2px, 0.08em) solid var(--accent);
          outline-offset: 0.25em;
        }
        .rail-body {
          display: none;
          max-height: calc(100vh - 48px);
          overflow-y: auto;
          border-block-start: 1.5px solid var(--ink);
          padding-block: 8px 16px;
          padding-inline: 0;
        }
        .rail:has(.rail-open:checked) .rail-body {
          display: block;
        }
        .rail:has(.rail-open:checked) .rail-toggle {
          background: var(--paper-2);
        }
      }
      /* THE NUMBERS-ONLY BAND. Between the ≤900 disclosure and the width that
         affords a 240px rail, the rail is clipped to its sheet numbers and the
         sheet takes the freed column. The list keeps its full 240 layout inside
         the clip, so every title stays in the accessibility tree; hover or a
         keyboard focus opens the rail OVER the sheet, never reflowing it. */
      @media (min-width: 901px) and (max-width: 1180px) {
        .app {
          grid-template-columns: 56px minmax(0, 1fr);
        }
        .rail {
          width: 56px;
          overflow-x: clip;
          z-index: 8;
        }
        .rail-head,
        .rail-body {
          width: 240px;
        }
        /* clipped, not removed: the lettering fades, the links stay focusable */
        .rail-head,
        .rail-top,
        .rail-sec,
        .rail-links .t,
        .rail-band > summary .t,
        .rail-band > summary::after {
          opacity: 0;
        }
        /* a band steps in less here, so its widest number (7B·3D) clears the clip */
        .rail-band > .rail-links {
          margin-inline-start: 8px;
        }
        .rail-band > .rail-links a {
          padding-inline-start: 8px;
        }
        .rail:focus-within {
          width: 240px;
        }
        .rail:focus-within .rail-head,
        .rail:focus-within .rail-top,
        .rail:focus-within .rail-sec,
        .rail:focus-within .rail-links .t,
        .rail:focus-within .rail-band > summary .t,
        .rail:focus-within .rail-band > summary::after {
          opacity: 1;
        }
        @media (hover: hover) and (pointer: fine) {
          .rail:hover {
            width: 240px;
          }
          .rail:hover .rail-head,
          .rail:hover .rail-top,
          .rail:hover .rail-sec,
          .rail:hover .rail-links .t,
          .rail:hover .rail-band > summary .t,
          .rail:hover .rail-band > summary::after {
            opacity: 1;
          }
        }
        @media (prefers-reduced-motion: no-preference) {
          .rail {
            transition: width 120ms ease;
          }
          .rail-head,
          .rail-top,
          .rail-sec,
          .rail-links .t,
          .rail-band > summary .t {
            transition: opacity 120ms ease;
          }
        }
      }
      /* ---- the content column ---- */
      .content {
        min-width: 0;
        padding-block: 0 clamp(12px, 0.25rem + 2vw, 30px);
        padding-inline: clamp(12px, 0.25rem + 1.35vw, 24px);
      }
      ui-view {
        display: block;
      }
      .content > .sheet:first-child {
        margin-block-start: 0;
      }
      a.xref {
        color: var(--accent);
        text-decoration-color: var(--accent-soft);
      }
      /* THE UTILITY BAR: crumb left, utilities right, one sticky strip. */
      .util {
        position: sticky;
        inset-block-start: 0;
        z-index: 6;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px 18px;
        min-height: 34px;
        margin-block: 0 14px;
        margin-inline: 0;
        padding: 4px 2px;
        background: var(--ground);
        border-block-end: 1px solid var(--edge);
        font-family: var(--data);
        font-size: 10px;
        letter-spacing: 0.14em;
        color: var(--ink-soft);
      }
      .util a {
        color: var(--ink-soft);
        text-decoration: none;
      }
      @media (hover: hover) and (pointer: fine) {
        .util a:hover {
          color: var(--ink);
          text-decoration: underline;
          text-decoration-color: var(--accent-soft);
        }
      }
      .crumb {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 14px;
        min-width: 0;
        font-variant-numeric: tabular-nums;
      }
      /* The one fact in the strip, not one link among six. */
      .crumb .sh {
        font-weight: 600;
        color: var(--ink);
      }
      .util-links {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        gap: 4px 14px;
        flex: 0 0 auto;
      }
      .themer {
        display: flex;
        gap: 10px;
        margin-inline-start: 4px;
        padding-inline-start: 14px;
        border-inline-start: 1px solid var(--edge);
      }
      .themer button,
      .util-copy {
        font-family: var(--data);
        font-size: 10px;
        letter-spacing: 0.14em;
        color: var(--ink-soft);
        background: none;
        border: none;
        border-block-end: 1.5px solid transparent;
        padding-block: 2px 1px;
        padding-inline: 0;
        cursor: pointer;
      }
      @media (hover: hover) and (pointer: fine) {
        .themer button:hover,
        .util-copy:hover {
          color: var(--ink);
        }
      }
      /* invisible, never display:none: the copy fallback selects it */
      .util-copy-src {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }
      .themer button[aria-pressed='true'] {
        color: var(--ink);
        border-block-end-color: var(--accent);
      }
      @media (max-width: 900px) {
        .util {
          position: static;
          flex-wrap: wrap;
          padding: 8px 2px;
        }
        .util-links {
          flex: 1 1 100%;
          min-width: 0;
          justify-content: flex-start;
        }
      }
      /* Plate metadata under the bar: what the crumb used to carry beside the nav. */
      .plate-data {
        margin-block: -4px 12px;
        margin-inline: 0;
        font-family: var(--data);
        font-size: 10px;
        letter-spacing: 0.14em;
        font-variant-numeric: tabular-nums;
        color: var(--ink-soft);
        display: flex;
        flex-wrap: wrap;
        gap: 4px 18px;
      }
      .plate-data a {
        color: var(--ink-soft);
      }
      /* the plate's own keys, in the cards' key-row shape */
      .plate-data .keyrow {
        align-self: start;
        margin-block-start: 0;
      }
      .plate-verdict {
        margin-block: -6px 14px;
        margin-inline: 0;
        font-family: var(--prose);
        font-size: 13.5px;
        font-style: italic;
        color: var(--ink-soft);
      }
      .loading {
        font-family: var(--data);
        font-size: 11.5px;
        letter-spacing: 0.14em;
        color: var(--ink-faint);
        padding: 40px 4px;
      }
      /* ---- the cover: a title sheet ---- */
      .cover-title {
        font-family: var(--display);
        font-size: clamp(30px, 0.5rem + 2.6vw, 44px);
        letter-spacing: 0.14em;
        font-weight: 600;
        margin-block: 6px;
        margin-inline: 0;
      }
      /* ONE NAME, ONE FORM. The cover title and the rail head carry plain
         uppercase THE ALTITUDE ATLAS in the display face, nothing set apart, so
         the homepage says the name once in one voice. The ledger sites — every
         sheet-head PROJECT line and every title block — draw the same name
         through `.project-mark` (in the generated sheets/atlas.css); only the
         size differs. */
      /* two lines, not one 141-character rule: the motto, then the stamp */
      .cover-sub .stamp {
        display: block;
        color: var(--ink-faint);
        margin-block-start: 3px;
      }
      /* The key image is the whole width of the sheet — the issue log that used
         to ride beside it is its own state at /log. */
      .hero {
        display: block;
        margin-block: 22px 14px;
        margin-inline: 0;
      }
      .hero-plate {
        display: block;
        border: 1.5px solid var(--ink);
        background: var(--paper);
        color: inherit;
        text-decoration: none;
      }
      @media (hover: hover) and (pointer: fine) {
        .hero-plate:hover {
          background: var(--paper-2);
        }
      }
      .hero-plate svg {
        display: block;
        margin: 0 auto;
        width: 100%;
        height: auto;
        /* Prominent, but not a screenful — and CONTAINED like a plate. An inline
           SVG letterboxes under max-height inside a full-width frame, so the cap
           reaches it through max-width times the hero's own viewBox ratio
           (--plate-ar, stamped by emit-app's heroPlate). */
        max-width: min(100%, calc(min(72vh, 820px) * var(--plate-ar, 1.4)));
        padding-block: 6px 0;
        padding-inline: 4px;
      }
      .hero-cap {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 4px 16px;
        border-block-start: 1.5px solid var(--ink);
        padding-block: 8px 9px;
        padding-inline: 12px;
        font-family: var(--data);
        font-size: 10px;
        letter-spacing: 0.14em;
        color: var(--ink-soft);
        font-variant-numeric: tabular-nums;
      }
      .hero-cap .t {
        font-family: var(--title);
        font-size: 13.5px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--ink);
      }
      .hero-cap .go {
        color: var(--accent);
        font-weight: 600;
      }
      /* THE ONE LINE OF ISSUE RECORD ON THE COVER — the log itself is /log. */
      .cover-latest {
        margin-block: 0 8px;
        margin-inline: 0;
      }
      .cover-latest a {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 2px 14px;
        border: 1.5px solid var(--ink);
        border-block-start: none;
        background: var(--paper);
        padding-block: 8px 9px;
        padding-inline: 12px;
        font-family: var(--data);
        font-size: 10.5px;
        letter-spacing: 0.12em;
        font-variant-numeric: tabular-nums;
        color: var(--ink-soft);
        text-decoration: none;
      }
      @media (hover: hover) and (pointer: fine) {
        .cover-latest a:hover {
          background: var(--paper-2);
        }
      }
      .cover-latest .k {
        font-weight: 600;
        color: var(--ink-faint);
      }
      .cover-latest .s {
        color: var(--accent);
        font-weight: 600;
      }
      .cover-latest .t {
        flex: 1 1 22ch;
        min-width: 0;
        font-family: var(--prose);
        font-size: 13px;
        letter-spacing: 0;
        color: var(--ink-soft);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .cover-latest .go {
        color: var(--accent);
        font-weight: 600;
        flex: 0 0 auto;
      }
      .issue-log h3 {
        font-family: var(--data);
        font-size: 11px;
        letter-spacing: 0.18em;
        font-weight: 600;
        color: var(--ink-soft);
        margin-block: 0 8px;
        margin-inline: 0;
      }
      .issue-log ol {
        list-style: none;
        padding: 0;
        margin: 0;
        border-block-start: 1.5px solid var(--ink);
      }
      .issue-log li {
        display: grid;
        grid-template-columns: 74px minmax(0, 1fr);
        gap: 1px 10px;
        padding-block: 6px 7px;
        padding-inline: 0;
        border-block-end: 1px solid var(--line);
        font-family: var(--data);
        font-variant-numeric: tabular-nums;
        font-size: 11.5px;
        letter-spacing: 0.03em;
      }
      .issue-log .d {
        font-size: 9.5px;
        letter-spacing: 0.1em;
        color: var(--ink-soft);
        padding-block-start: 2px;
      }
      .issue-log .s {
        color: var(--accent);
        font-weight: 600;
        text-decoration: none;
      }
      @media (hover: hover) and (pointer: fine) {
        .issue-log .s:hover {
          text-decoration: underline;
        }
      }
      .issue-log .t {
        grid-column: 2;
        color: var(--ink-soft);
      }
      .issue-log details {
        margin-block-start: 10px;
      }
      /* /log: the same rows with room to be a rev BLOCK — date, sheet, clause. */
      .issue-log-page {
        margin-block-start: 18px;
      }
      @media (min-width: 1000px) {
        .issue-log-page li {
          grid-template-columns: 96px 260px minmax(0, 1fr);
          gap: 0 16px;
        }
        .issue-log-page .t {
          grid-column: 3;
        }
      }
      .issue-log summary {
        font-family: var(--data);
        font-size: 10px;
        letter-spacing: 0.14em;
        color: var(--ink-soft);
        cursor: pointer;
        padding: 4px 0;
      }
      .issue-log details ol {
        margin-block-start: 6px;
      }
      /* Gallery index */
      .gal-body,
      .stat-bar,
      .survey {
        margin-inline: 0;
      }
      /* A section heading on the index, above a card grid. */
      .set-sec {
        font-family: var(--data);
        font-size: 11px;
        letter-spacing: 0.2em;
        font-weight: 600;
        color: var(--ink-soft);
        margin-block: 26px 14px;
        margin-inline: 0;
        padding-block: 10px 0;
        padding-inline: 0;
        border-block-start: 1.5px solid var(--ink);
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 14px;
        margin: 0;
      }
      /* On a wide display the cards get room to read rather than more of them. */
      @media (min-width: 1800px) {
        .cards {
          grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
          gap: 16px;
        }
      }
      /* THE CARD is a container, not a link: `.card-go` (the title) is the one
         primary link and stretches over the card through a ::after, so the key
         block's filter links are not nested inside a link. */
      .card {
        position: relative;
        border: 1.5px solid var(--ink);
        /* the card's ground is one of six gradients, cycling down the grid; the
           picture lies over it and the body's paper over the picture */
        background: var(--card-grad, var(--paper));
        color: inherit;
        display: block;
        /* the backdrop sits at z-index -1: isolate so it stays inside THIS card,
           and clip so it keeps the card's own edges */
        isolation: isolate;
        overflow: clip;
      }
      .card:has(:focus-visible) {
        outline: max(2px, 0.08em) solid var(--accent);
        outline-offset: 0.25em;
      }
      .card .card-go {
        color: inherit;
        text-decoration: none;
      }
      /* The stretched link covers the card, which is now its own padding box. */
      .card .card-go::after {
        content: '';
        position: absolute;
        inset: 0;
      }
      /* the card draws the ring; transparent still shows under forced colours */
      .card .card-go:focus-visible {
        outline: max(2px, 0.08em) solid transparent;
      }
      /* the current sheet's card, marked by uiSrefActive on its title link */
      .card:has(.card-go.is-active) {
        border-color: var(--accent);
      }
      /* THE SIX GROUNDS — gradients of the paper tinted by the page's own
         tokens, so each follows the theme; the grid cycles them by position. */
      .cards > .card:nth-child(6n + 1) {
        --card-grad: linear-gradient(160deg, color-mix(in oklab, var(--accent) 18%, var(--paper)), var(--paper-2));
      }
      .cards > .card:nth-child(6n + 2) {
        --card-grad: linear-gradient(20deg, color-mix(in oklab, var(--red) 14%, var(--paper)), var(--paper));
      }
      .cards > .card:nth-child(6n + 3) {
        --card-grad: radial-gradient(120% 90% at 20% 0%, color-mix(in oklab, var(--ink) 12%, var(--paper)), var(--paper-2));
      }
      .cards > .card:nth-child(6n + 4) {
        --card-grad: linear-gradient(90deg, var(--paper-2), color-mix(in oklab, var(--accent) 10%, var(--paper)));
      }
      .cards > .card:nth-child(6n + 5) {
        --card-grad: linear-gradient(200deg, color-mix(in oklab, var(--red) 8%, var(--paper-2)), color-mix(in oklab, var(--accent) 8%, var(--paper)));
      }
      .cards > .card:nth-child(6n + 6) {
        --card-grad: radial-gradient(100% 100% at 80% 100%, color-mix(in oklab, var(--accent) 14%, var(--paper-2)), var(--paper));
      }
      /* THE BACKDROP (T16) — the plate's picture, laid over the WHOLE card and
         behind everything written on it. `z-index: -1` inside the card's own
         stacking context paints it under the window and the body yet over the
         card's own ground, so the gradient shows through everything the drawing
         does not cover (the picture is transparent outside the ink — see
         generator/thumbs.mjs). Top-anchored, so the head window always holds
         the drawing's top. On at rest; nothing moves. */
      .card-pic {
        display: block;
        position: absolute;
        inset: 0;
        z-index: -1;
      }
      /* THE WINDOW — a clear pane across the head of the card, 259 x 150 in
         ratio: the picture and the ground show through it as they are. */
      .card-window {
        width: 100%;
        aspect-ratio: 259 / 150;
        border-block-end: 1px solid var(--line);
      }
      .card-pic img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        /* top-anchored: the head window holds the drawing's top, and a plate
           shorter than the card runs out into transparency behind the body */
        object-position: 50% 0;
      }
      /* The theme picks ONE of the pair, in the three states atlas.css declares.
         A `display: none` lazy image is never requested, so the card fetches
         exactly one file — which is why this is two <img> and not a <picture>
         (a source's media query cannot see the pinned data-theme). */
      .card-pic .d {
        display: none;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) .card-pic .l {
          display: none;
        }
        :root:not([data-theme='light']) .card-pic .d {
          display: block;
        }
      }
      :root[data-theme='dark'] .card-pic .l {
        display: none;
      }
      :root[data-theme='dark'] .card-pic .d {
        display: block;
      }
      /* THE BODY — the card's paper, opaque, so the writing sits on plain
         ground whatever runs under the window. */
      .card-body {
        background: var(--paper);
        padding-block: 14px 15px;
        padding-inline: 16px;
      }
      .card:has(.card-go.is-active) .card-body {
        background: var(--paper-2);
      }
      @media (hover: hover) and (pointer: fine) {
        .card:hover .card-body {
          background: var(--paper-2);
        }
      }
      .card .n {
        font-family: var(--data);
        font-size: 10px;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.16em;
        color: var(--accent);
      }
      .card h3 {
        font-family: var(--title);
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.04em;
        margin-block: 5px 6px;
        margin-inline: 0;
      }
      /* three lines of caption, hovered or not; the rest is on the sheet */
      .card p {
        font-family: var(--prose);
        font-size: 14px;
        line-height: 21px;
        color: var(--ink-soft);
        margin: 0;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .card .alt {
        font-family: var(--data);
        font-size: 10px;
        letter-spacing: 0.14em;
        color: var(--ink-faint);
        display: block;
        margin-block: -2px 7px;
        margin-inline: 0;
      }
      .card .meta {
        font-family: var(--data);
        font-size: 10px;
        letter-spacing: 0.12em;
        color: var(--ink-faint);
        margin-block-start: 9px;
        display: block;
      }
      /* THE KEY INDEX — FORM split into keys, each key indexed in the shape its
         type asks for. A chip is a link: every filtered index has its own url. */
      .keyindex {
        border: 1.5px solid var(--ink);
        background: var(--paper);
        margin-block: 0 14px;
        margin-inline: 0;
      }
      .khead {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0 14px;
        padding-block: 8px 7px;
        padding-inline: 14px;
        border-block-end: 1.5px solid var(--ink);
        background: var(--paper-2);
        font-family: var(--data);
        font-size: 10px;
        letter-spacing: 0.16em;
        color: var(--ink-soft);
      }
      .khead .kn {
        font-variant-numeric: tabular-nums;
        margin-inline-start: auto;
      }
      .khead .kclear {
        color: var(--accent);
        text-decoration: none;
      }
      .krow {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px 10px;
        padding: 8px 14px;
        border-block-end: 1px solid var(--line);
      }
      /* basis is meaningful only inside the city group, so it is drawn inside it */
      .krow-in {
        padding-inline-start: 34px;
        border-inline-start: 3px solid var(--accent);
        background: var(--paper-2);
      }
      .krow .kk {
        font-family: var(--data);
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-faint);
        min-width: 92px;
      }
      .kchips {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      .keyindex .kv {
        font-family: var(--data);
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        border: 1px solid var(--line);
        padding: 2px 7px;
        color: var(--ink-soft);
        text-decoration: none;
        white-space: nowrap;
      }
      @media (hover: hover) and (pointer: fine) {
        .keyindex .kv:hover {
          border-color: var(--ink);
          background: var(--paper-2);
        }
      }
      .keyindex .kv.is-on {
        border-color: var(--ink);
        background: var(--ink);
        color: var(--paper);
      }
      .keyindex .kv i {
        font-style: normal;
      }
      /* THE INDEX IS THE LEGEND: the chip draws the card's symbol, at 12, and
         names it. Values with no drawing — the ALL chip, static, the basis
         phrases — are words here exactly as they are on the cards. */
      .keyindex .kv {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .keyindex .kv .gl {
        flex: none;
        width: 12px;
        height: 12px;
        display: block;
      }
      .keyindex .kv .c {
        font-variant-numeric: tabular-nums;
        margin-inline-start: 6px;
        color: var(--ink-faint);
      }
      .keyindex .kv.is-on .c {
        color: inherit;
        opacity: 0.85;
      }
      .kvbox {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding-block: 8px 10px;
        padding-inline: 14px;
      }
      .kvbox label {
        font-family: var(--data);
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-faint);
        min-width: 92px;
      }
      .kvbox input {
        font-family: var(--data);
        font-size: 11px;
        letter-spacing: 0.06em;
        color: var(--ink);
        background: var(--paper-2);
        border: 1px solid var(--line);
        padding: 4px 8px;
        flex: 1 1 22ch;
        min-width: 0;
      }
      /* outranks .kvbox input's 11px so a touch focus never zooms the page */
      @media (pointer: coarse) {
        .kvbox input {
          font-size: max(16px, 1rem);
        }
      }
      .kvbox input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }
      .kvbox button {
        font-family: var(--data);
        font-size: 10px;
        letter-spacing: 0.16em;
        color: var(--paper);
        background: var(--ink);
        border: 1.5px solid var(--ink);
        padding: 4px 12px;
        cursor: pointer;
      }
      .kempty {
        font-family: var(--data);
        font-size: 11px;
        letter-spacing: 0.12em;
        color: var(--ink-soft);
        border: 1px dashed var(--line);
        padding: 18px 14px;
        margin: 0;
      }
      /* The key icons' sprite: inline markup, drawn once a page and never
         painted. `display: none` would stop a <use> resolving, so it is taken
         out of flow at no size instead. */
      .icon-sprite {
        position: absolute;
        width: 0;
        height: 0;
        overflow: clip;
      }
      /* THE KEY ROW — FORM's keys as ONE LINE OF ICONS, hairline-separated in
         the idiom generator/chrome.mjs draws the plates' own title block:
         subject, the basis beside it on a city, projection, and the lamp a
         plate that answers a pointer carries. NO field names and no words: the
         icons are named once, in the cover's KEY INDEX, which is their legend.
         A key the plate does not carry draws nothing, so the row is as long as
         the plate is. Cells are filter links and sit above the card's
         stretched title link. */
      .keyrow {
        display: flex;
        flex-wrap: wrap;
        align-items: stretch;
        width: fit-content;
        max-width: 100%;
        border: 1px solid var(--line);
        margin-block-start: 10px;
        position: relative;
        z-index: 1;
        font-family: var(--data);
        background: color-mix(in oklab, var(--paper) 70%, transparent);
      }
      .keyrow .kr-cell {
        display: flex;
        align-items: center;
        gap: 6px;
        padding-block: 4px 5px;
        padding-inline: 9px;
        border-inline-start: 1px solid var(--line);
        color: var(--ink-soft);
        text-decoration: none;
        min-width: 0;
      }
      .keyrow .kr-cell:first-child {
        border-inline-start: none;
      }
      @media (hover: hover) and (pointer: fine) {
        .keyrow a.kr-cell:hover {
          background: var(--paper-2);
          color: var(--ink);
        }
      }
      .keyrow a.kr-cell:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      /* the applied gallery filter, echoed on the cell that would set it */
      .keyrow a.kr-cell.is-on {
        background: var(--ink);
        color: var(--paper);
      }
      /* SUBJECT is the row's word, so its drawing is set in the ink */
      .keyrow .kr-subject {
        color: var(--ink);
      }
      /* An icon draws at 14 on a card: one 16-grid symbol out of the page's
         one sprite, stroked in the running colour. */
      .keyrow .gl {
        flex: none;
        width: 14px;
        height: 14px;
        display: block;
      }
      /* BASIS is the detail a city needs and no other key does — the value
         itself, in the data face, beside the subject it qualifies. */
      .keyrow .dt {
        font-size: 10px;
        letter-spacing: 0.11em;
        text-transform: uppercase;
        overflow-wrap: anywhere;
      }
      /* MODE is a boolean: the lamp is lit accent when a plate answers a
         pointer, and nothing at all when it does not. */
      .keyrow .kr-mode {
        color: var(--accent);
      }
      .keyrow a.kr-mode.is-on {
        color: var(--paper);
      }
      /* THE WIDE BAND — the numbers and the argument, after the index. Over
         1800 the survey table and the reading column sit side by side, so the
         width is used instead of leaving a canyon beside a 72ch column. */
      .cover-band {
        margin-block: 26px 0;
        margin-inline: 0;
        padding-block: 10px 0;
        padding-inline: 0;
        border-block-start: 1.5px solid var(--ink);
      }
      .cover-band .stat-bar {
        margin-block-start: 0;
      }
      @media (min-width: 1800px) {
        .cover-wide {
          display: grid;
          grid-template-columns: minmax(0, 1fr) minmax(0, 72ch);
          gap: 0 28px;
          align-items: start;
        }
        .cover-wide .survey {
          margin-block-end: 0;
        }
      }
      /* THE COLOPHON reads at one measure, flush with its head like the cover's
         reading column; over 1800 it runs in columns of that measure, so the
         width is read instead of left as a canyon beside one column. */
      .prose {
        max-width: 72ch;
      }
      @media (min-width: 1800px) {
        .prose {
          max-width: none;
          column-width: 60ch;
          column-gap: 48px;
          orphans: 3;
          widows: 3;
        }
        .prose h2 {
          column-span: all;
        }
        .prose h3 {
          break-after: avoid;
        }
      }
      .prose h2 {
        font-family: var(--title);
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.06em;
        margin-block-end: 12px;
      }
      .prose h3 {
        font-family: var(--data);
        font-size: 11px;
        letter-spacing: 0.18em;
        color: var(--ink-soft);
        margin-block: 22px 8px;
        margin-inline: 0;
      }
      .prose p {
        font-family: var(--prose);
        font-size: 15.5px;
        margin-block-end: 10px;
      }
      .prose code {
        font-family: var(--code);
        font-size: 0.88em;
        background: var(--paper-2);
        padding: 0 3px;
      }
      .plate-verdict .lead {
        font-family: var(--data);
        font-style: normal;
        font-size: 10px;
        letter-spacing: 0.14em;
        color: var(--ink-soft);
        margin-inline-end: 10px;
      }
      /* ---- press: every pressable gives under the pointer ---- */
      .themer button:active,
      .util-copy:active,
      .rail-toggle:active,
      .kvbox button:active,
      .keyindex .kv:active {
        transform: scale(0.97);
      }
      @media (prefers-reduced-motion: no-preference) {
        .themer button,
        .util-copy,
        .rail-toggle,
        .kvbox button,
        .keyindex .kv {
          transition: transform 160ms var(--ease-out, ease-out);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
