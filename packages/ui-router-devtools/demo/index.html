<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Router devtools demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: light-dark(#fafafa, #161616);
        --fg: light-dark(#222, #e8e8e8);
        --line: light-dark(#ddd, #333);
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.5 system-ui,
          sans-serif;
      }
      header,
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 24px 20px;
      }
      header {
        border-bottom: 1px solid var(--line);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 20px;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      button {
        font: inherit;
        font-size: 14px;
        padding: 4px 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Hello Galaxy</h1>
      <nav aria-label="Demo navigation">
        <button data-go="galaxy.stars">Stars</button>
        <button data-go="galaxy.stars.star:vega">Vega</button>
        <button data-go="galaxy.stars.star:sirius">Sirius</button>
        <button data-go="galaxy.astronaut">Astronaut</button>
        <button data-go="galaxy">Galaxy (redirect)</button>
        <button data-go="galaxy.blackhole">Black hole (error)</button>
        <button data-go="admin.users">Admin (lazy)</button>
        <button data-action="url">Astronaut by URL</button>
        <button data-action="replace">Arcturus (replace)</button>
        <button data-action="reload">Reload</button>
        <button data-action="invalid">Planets (invalid)</button>
        <button data-action="demo">Run demo sequence</button>
      </nav>
    </header>
    <main id="view"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
