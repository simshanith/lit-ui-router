  vitest: ^5.0.0
  vue: ^3.5.41
  vue-tsc: ^3.3.11
  wrangler: 4.113.0

catalogMode: prefer

catalogs:
  lit2-compat:
    lit-2: npm:lit@^2.8.0
  mobx6-compat:
    mobx-6: npm:mobx@^6.16.1
  peerFloor:
    lit-ui-router-floor: npm:lit-ui-router@1.7.0
  publishedDependencies:
    '@oxc-project/runtime': '>=0.50.0'
  publishedPeer:
    '@uirouter/core': ^6.0.8
    hono: ^4.0.0
    lit: '^2.0.0 || ^3.0.0'
    lit-ui-router: ^1.7.0
    mobx: '^6.0.0 || ^7.0.0'
    typedoc: ^0.28.0
  typescript6-compat:
    typescript: npm:@typescript/typescript6@^6.0.2
  typescript6:
    typescript: ^6.0.3
    typescript-6: npm:typescript@^6.0.3

allowBuilds:
  cypress: true
  esbuild: true
  playwright: true
  rs-module-lexer: true
  sharp: true
  workerd: true

overrides:
  '@api-viewer/common>lit': ^3.3.3
  '@api-viewer/docs>lit': ^3.3.3
  'brace-expansion@5': 5.0.9
  d3-color: 3.1.0
  dompurify: 3.4.13
  fast-uri: 3.1.5
  'lit-dialog>lit': ^3.3.3
  postcss: 8.5.26
  sharp: 0.35.0
  shell-quote: 1.9.0
  tar: 7.5.22
  'undici@6': 6.28.0
  'undici@7': 7.29.0

packageExtensions:
  conventional-changelog-preset-loader:
    dependencies:
      conventional-changelog-conventionalcommits: ^10.2.1
  lit-analyzer:
    dependencies:
      typescript: npm:@typescript/typescript6@^6.0.2

verifyDepsBeforeRun: false

linkWorkspacePackages: true

patchedDependencies:
  '@api-viewer/docs': patches/@api-viewer__docs.patch
  lit-dialog: patches/lit-dialog.patch

minimumReleaseAgeStrict: true

minimumReleaseAgeExclude:
  - vitest@5.0.0
  - '@vitest/browser@5.0.0'
  - '@vitest/browser-playwright@5.0.0'
  - '@vitest/coverage-v8@5.0.0'
  - '@vitest/mocker@5.0.0'
  - '@vitest/pretty-format@5.0.0'
  - '@vitest/spy@5.0.0'
  - '@vitest/ui@5.0.0'
  - '@vitest/utils@5.0.0'
