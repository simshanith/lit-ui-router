packages:
  - apps/*
  - packages/*
  - tools/*
  - docs
  - examples

catalog:
  '@ampproject/remapping': ^2.3.0
  '@api-viewer/docs': 1.0.0-pre.10
  '@arethetypeswrong/core': ^0.18.5
  '@codecov/bundle-analyzer': ^2.0.1

  oxc-project-runtime: 'npm:@oxc-project/runtime@0.143.0'
  '@commitlint/cli': ^21.2.0
  '@commitlint/config-conventional': ^21.2.0
  '@commitlint/types': ^21.2.0
  '@custom-elements-manifest/analyzer': ^0.11.0
  '@pnpm/logger': 1100.0.0
  '@pnpm/types': 1101.8.0
  '@pnpm/workspace.project-manifest-reader': 1100.0.22
  '@pnpm/workspace.projects-reader': 1101.0.21
  '@pnpm/workspace.workspace-manifest-reader': 1100.1.4
  '@release-it/conventional-changelog': ^12.0.0
  '@spectrum-web-components/icons-workflow': ^1.12.2
  '@types/dom-navigation': ^1.0.7
  '@types/lodash': ^4.17.25
  '@types/node': ^24.13.3
  '@types/pacote': ^11.1.8
  '@types/semver': ^7.8.0
  '@uirouter/core': ^6.1.2
  '@uirouter/dsr': ^1.2.0
  '@uirouter/sticky-states': ^1.5.1
  '@uirouter/visualizer': ^7.2.1
  '@vitest/browser-playwright': ^4.1.10
  '@vitest/coverage-v8': ^4.1.10
  concurrently: ^10.0.4
  cypress: ^15.19.0
  diff: ^9.0.0
  esbuild: ^0.28.1
  eslint: ^10.8.0
  eslint-formatter-tap: ^9.0.1
  eslint-plugin-oxlint: ^1.76.0
  eslint-plugin-package-json: ^1.6.2
  eslint-plugin-pnpm: ^1.7.0
  eslint-plugin-turbo: ^2.10.8
  happy-dom: ^20.11.1
  hono: ^4.12.34
  husky: ^9.1.7
  jsonc-parser: ^3.3.1
  lit: ^3.3.3
  lit-analyzer: ^2.0.3
  lit-dialog: ^2.0.1
  lodash: ^4.18.1
  mobx: ^7.0.0
  oxc-minify: 0.143.0
  oxc-transform: 0.143.0
  oxfmt: 0.61.0
  oxlint: 1.76.0
  oxlint-tsgolint: 7.0.2001
  pacote: ^22.0.0
  playwright: ^1.62.1
  publint: ^0.3.22
  release-it: ^21.0.1
  rimraf: ^6.1.3
  rolldown: ^1.2.2
  screenfull: ^6.0.2
  semver: ^7.8.5
  start-server-and-test: ^3.0.12
  turbo: ^2.10.8
  typedoc: ^0.28.20
  typedoc-plugin-markdown: ^4.12.0
  typedoc-vitepress-theme: ^1.1.3
  typescript: ^7.0.2
  typescript-5.0: npm:typescript@5.0.4
  typescript-5.9: npm:typescript@^5.9.3
  typescript-7: npm:typescript@^7.0.2
  valibot: ^1.4.2
  vite: ^8.2.1
  vite-plugin-checker: ^0.14.5
  vite-plugin-static-copy: ^4.1.1
  vitepress: ^2.0.0-alpha.19
  vitest: ^4.1.10
  vue: ^3.5.40
  vue-tsc: ^3.3.9
  wrangler: 4.113.0

catalogMode: prefer

catalogs:
  lit2-compat:
    lit-2: npm:lit@^2.8.0
  mobx6-compat:
    mobx-6: npm:mobx@^6.16.1
  # exact published floor of the matching publishedPeer range; peer-floor-guard
  # fails the typecheck:peer-floor task when the two drift apart
  peerFloor:
    lit-ui-router-floor: npm:lit-ui-router@1.7.0
  publishedDependencies:
    '@oxc-project/runtime': '>=0.50.0'
  publishedPeer:
    '@uirouter/core': ^6.0.8
    hono: ^4.0.0
    lit: '^2.0.0 || ^3.0.0'
    lit-ui-router: ^1.7.0
    mobx: '^6.0.0 || ^7.0.0'
    typedoc: ^0.28.0
  typescript6-compat:
    typescript: npm:@typescript/typescript6@^6.0.2
  typescript6:
    typescript: ^6.0.3
    typescript-6: npm:typescript@^6.0.3

allowBuilds:
  cypress: true
  esbuild: true
  playwright: true
  rs-module-lexer: true
  sharp: true
  workerd: true

overrides:
  'brace-expansion@5': 5.0.9
  d3-color: 3.1.0
  dompurify: 3.4.13
  fast-uri: 3.1.5
  postcss: 8.5.26
  sharp: 0.35.0
  shell-quote: 1.9.0
  tar: 7.5.22
  'undici@6': 6.28.0
  'undici@7': 7.29.0

packageExtensions:
  conventional-changelog-preset-loader:
    dependencies:
      conventional-changelog-conventionalcommits: ^10.2.1
  lit-analyzer:
    dependencies:
      typescript: npm:@typescript/typescript6@^6.0.2

verifyDepsBeforeRun: false

# Link a workspace package whenever a plain range matches its version, not only
# explicit `workspace:*`. First layer of the @tools npm-block (see .npmrc).
linkWorkspacePackages: true

patchedDependencies:
  '@api-viewer/docs': patches/@api-viewer__docs.patch
  '@vitest/browser': patches/@vitest__browser.patch
  lit-dialog: patches/lit-dialog.patch

minimumReleaseAgeStrict: true
