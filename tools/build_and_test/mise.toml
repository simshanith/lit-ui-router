# Build-test workflow tasks — addressed as //tools/build_and_test:<step>
# (monorepo task addressing; the root config declares tools/* as
# config_roots). Tasks run from THIS directory, so run lines are
# src/-relative. Same inputs/secrets contract as tools/release/mise.toml:
# a task's inputs are env-backed usage flags (`mise run <task> --help` is the
# contract) that workflow step `env:` blocks satisfy as-is, and secrets stay in
# workflow step env (never mise [env]). Runner output targets — GITHUB_OUTPUT,
# GITHUB_STEP_SUMMARY — aren't expressible in usage and stay per-task comments.
# Unlike release, this file carries an [env] block — the _.path below — whose
# effect on a shell that merely cd's in here is a harmless duplicate (see its
# note).
# Tasks assume node_modules exists: build-test.yml runs `mise run setup` as a
# dedicated first step, so tasks don't re-declare `depends = ["//:setup"]`
# (which re-ran pnpm install per step). Run `mise run setup` first when
# invoking a task standalone.

[env]
# This package's own devDep binaries (playwright, cypress) for the tasks
# below. Absolute via config_root (this directory); the root config's
# {{cwd}} entry only covers shells already cd'd in here, not `mise run`
# from elsewhere. For cd'd shells this is a harmless duplicate.
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.xvfb]
# env: GITHUB_ENV (DISPLAY export target; prints-only when unset).
# XVFB_* overrides serve the unit tests and local reproduction.
# The `start-xvfb` package.json bin is an executable (shebang + 0755), so it
# runs directly — pnpm never self-links a package's own bin onto its own
# PATH, so a bare `start-xvfb` wouldn't resolve here.
description = "Start the shared CI Xvfb display and export DISPLAY"
run = "./src/start-xvfb.ts"

[tasks.branch_ci_gate]
# env: GITHUB_REF_NAME, GH_TOKEN, GITHUB_OUTPUT, GITHUB_STEP_SUMMARY.
# The one task here that runs WITHOUT `mise run setup`: its script imports
# only node builtins, so the gate job needs no pnpm install to answer.
description = "Decide whether this branch-head push needs its own CI run"
run = "./src/branch-ci-gate.ts"

[tasks.turbo_summary]
# env: GITHUB_STEP_SUMMARY (runner output file; prints to stdout when unset) —
# an output target, so it stays a comment like the GITHUB_OUTPUT tasks below.
# Runs on every turbo run, green or red: the overview always, the failing-task
# detail only when something failed. Runs from the repo root, not this
# directory: the summary's `logFile` paths are repo-root-relative, and so is
# the --runs-dir default. Same direct-exec reason as `xvfb` above.
description = "Report a turbo run — cache, timings, and any failing tasks — to the step summary and stdout"
dir = "{{config_root}}/../.."
usage = '''
flag "--runs-dir <runs_dir>" help="Where `turbo --summarize` writes run summaries; the newest one is this report's input" default=".turbo/runs" env="TURBO_RUNS_DIR"
flag "--artifact-url <artifact_url>" help="Uploaded copy of that JSON, linked from the report as the uncapped view; the workflow passes the upload step's artifact-url" env="TURBO_SUMMARY_ARTIFACT_URL"
'''
run = 'TURBO_RUNS_DIR="${usage_runs_dir?}" TURBO_SUMMARY_ARTIFACT_URL="${usage_artifact_url:-}" ./tools/build_and_test/src/run-summary.ts'

[tasks.playwright_version]
# env: GITHUB_OUTPUT (step-output target). One task per browser tool so each
# cache step derives its key alone.
description = "Emit the installed playwright version to GITHUB_OUTPUT"
run = "node -p \"'playwright=' + require('playwright/package.json').version\" >> \"$GITHUB_OUTPUT\""

[tasks.cypress_version]
# env: GITHUB_OUTPUT (step-output target).
description = "Emit the installed cypress version to GITHUB_OUTPUT"
run = "node -p \"'cypress=' + require('cypress/package.json').version\" >> \"$GITHUB_OUTPUT\""

[tasks.playwright]
# The vitest browser legs need the Playwright browsers + system deps; the
# binary comes from this package's own devDependency.
description = "Install the Playwright browsers with system dependencies"
run = "playwright install --with-deps"

[tasks.playwright_deps]
# The cache-hit companion to `playwright`: browsers restored from cache, apt
# OS deps still needed on a fresh runner.
description = "Install only the Playwright system dependencies"
run = "playwright install-deps"

[tasks.playwright_deps_engines]
# Scoped hit-path deps: firefox+webkit are the only engines whose apt libs
# the runner image lacks; chromium and the Cypress Electron binary ride the
# preinstalled set (proven empirically — see the PR that added this).
description = "Install the Playwright system dependencies for firefox and webkit"
run = "playwright install-deps firefox webkit"

[tasks.cypress]
# Verify up front so the concurrent vanilla/mobx Cypress runs skip the
# "first time using Cypress" verification banner.
description = "Install and verify the Cypress binary"
run = ["cypress install", "cypress verify"]
