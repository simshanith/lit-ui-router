# Turbo summary tasks — addressed as //tools/turbo-summary:<step>. Every
# workflow job that runs turbo marks a session, then reports it. Tasks run
# from the repo root: the run summaries, task logs and session marker are all
# repo-root-relative. Inputs are env-backed usage flags, as in
# tools/build_and_test/mise.toml. Tasks assume node_modules exists; run
# `mise run setup` first when invoking one standalone.

[tasks.mark_session]
description = "Mark the start of a CI session, so the turbo summary can report every run in it"
dir = "{{config_root}}/../.."
usage = '''
flag "--session-file <session_file>" help="Where the session start is stamped; turbo_summary reads the same path" default=".turbo/summary-session" env="TURBO_SUMMARY_SESSION"
'''
run = 'TURBO_SUMMARY_SESSION="${usage_session_file?}" ./tools/turbo-summary/src/mark-summary-session.ts'

[tasks.turbo_summary]
# env: GITHUB_STEP_SUMMARY (runner output file; prints to stdout when unset) —
# an output target, so it stays a comment.
# Runs on every turbo run, green or red: the overview always, the failing-task
# detail only when something failed. The report itself fails open; only
# --build-outcome=failure makes the task exit non-zero.
# The bin runs directly: pnpm never links a package's own bin onto its PATH.
description = "Report this session's turbo runs — cache, timings, and any failing tasks — to the step summary and stdout"
dir = "{{config_root}}/../.."
usage = '''
flag "--runs-dir <runs_dir>" help="Where `turbo --summarize` writes run summaries; every one this session wrote is an input" default=".turbo/runs" env="TURBO_RUNS_DIR"
flag "--session-file <session_file>" help="The mark_session stamp that bounds the session; without it only the newest run is reported" default=".turbo/summary-session" env="TURBO_SUMMARY_SESSION"
flag "--artifact-url <artifact_url>" help="Uploaded copy of that JSON, linked from the report as the uncapped view; the workflow passes the upload step's artifact-url" env="TURBO_SUMMARY_ARTIFACT_URL"
flag "--logs-url <logs_url>" help="Uploaded per-task turbo logs, linked from the report; the workflow passes the logs upload step's artifact-url" env="TURBO_LOGS_ARTIFACT_URL"
flag "--build-outcome <build_outcome>" help="The build step's outcome; `failure` exits 1 after the report, so a red job opens on this step" env="BUILD_OUTCOME"
'''
run = [
  'TURBO_RUNS_DIR="${usage_runs_dir?}" TURBO_SUMMARY_SESSION="${usage_session_file?}" TURBO_SUMMARY_ARTIFACT_URL="${usage_artifact_url:-}" TURBO_LOGS_ARTIFACT_URL="${usage_logs_url:-}" ./tools/turbo-summary/src/run-summary.ts',
  'if [ "${usage_build_outcome:-}" = failure ]; then echo "turbo_summary: the build step failed; its failing tasks are reported above" >&2; exit 1; fi',
]

[tasks.format_patch]
# Its own step so CI can upload the patch before turbo_summary links it;
# turbo_summary rewrites the same patch.
description = "Write this session's formatting fixes to .turbo/format.patch"
dir = "{{config_root}}/../.."
run = "./tools/turbo-summary/src/format-patch.ts"

[tasks.bench_summary]
# env: GITHUB_STEP_SUMMARY (runner output file; prints only when unset).
description = "Report the ui-router-server bench pulse from the bench result files"
dir = "{{config_root}}/../.."
run = "./tools/turbo-summary/src/bench-summary.ts"
