<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The location plugins read their base from here. %BASE_URL% is vite's
         html env replacement of `base`, which vite.config.ts derives from
         src/routes.ts's MOUNT — the one base constant. -->
    <base href="%BASE_URL%" />
    <title>The Altitude Atlas — Drawing Set</title>
    <meta
      name="description"
      content="The Altitude Atlas as a single-page drawing set: twenty-one sheets of the lit-ui-router codebase, routed with lit-ui-router."
    />
    <link rel="stylesheet" href="%BASE_URL%sheets/atlas.css" />
    <!-- THE TYPE, stand-in half. atlas.css names the Adobe family first in
         every role stack and the Google Fonts stand-in second; this link is
         the second half, and it is the ONLY half the claude.ai ARTIFACT can
         have (that host allows stylesheets from Google Fonts and nothing
         else), so the artifact keeps exactly these three links.
         On the SITE it is the other way round: generator/stage-site.mjs
         STRIPS these three links from the staged copy and injects the Adobe
         kit instead, so a staged page has one font host, not two.
         The prose is therefore Source Serif Pro from the kit on the site and
         Source Serif 4 from Google in the artifact — one design, two
         releases; the code face is the same deal, source-code-pro from the
         kit and Source Code Pro from Google, at the kit's own 400/700. The
         hand (--hand) asks Google for nothing: off the kit it falls to the
         data face. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600&family=Barlow+Semi+Condensed:wght@400;600&family=Source+Serif+4:ital,wght@0,400;1,400&family=Source+Code+Pro:wght@400;700&display=swap"
    />
    <style>
      /* The app chrome. Everything below leans on the tokens atlas.css
         declares, so the index reads as part of the drawing set. */
      body {
        padding: 0;
      }
      .app {
        display: grid;
        grid-template-columns: 240px minmax(0, 1fr);
        min-height: 100vh;
      }
      @media (max-width: 900px) {
        .app {
          grid-template-columns: 1fr;
        }
      }
      .rail {
        position: sticky;
        top: 0;
        align-self: start;
        max-height: 100vh;
        overflow-y: auto;
        background: var(--paper);
        border-right: 1.5px solid var(--ink);
        padding: 14px 0 30px;
      }
      @media (max-width: 900px) {
        .rail {
          position: static;
          max-height: none;
          border-right: none;
          border-bottom: 1.5px solid var(--ink);
        }
      }
      .rail-head {
        padding: 6px 16px 12px;
        border-bottom: 1.5px solid var(--ink);
        margin-bottom: 10px;
      }
      .rail-head .kicker {
        display: block;
        font-family: var(--data);
        font-size: 9px;
        letter-spacing: 0.18em;
        color: var(--ink-soft);
      }
      .rail-head h1 {
        font-family: var(--display);
        font-size: 17px;
        letter-spacing: 0.14em;
        font-weight: 600;
        margin: 5px 0 0;
      }
      .rail-head h1 a {
        color: inherit;
        text-decoration: none;
      }
      .rail-links {
        display: flex;
        flex-direction: column;
      }
      .rail-links a,
      .rail-top a {
        display: flex;
        gap: 9px;
        align-items: baseline;
        font-family: var(--data);
        font-size: 11px;
        letter-spacing: 0.06em;
        text-decoration: none;
        color: var(--ink);
        padding: 6px 16px;
        border-left: 3px solid transparent;
      }
      .rail-links a:hover,
      .rail-top a:hover {
        background: var(--paper-2);
      }
      .rail-links a.is-active,
      .rail-top a.is-active {
        background: var(--paper-2);
        border-left-color: var(--accent);
        font-weight: 600;
      }
      .rail-links .n {
        font-family: var(--data);
        color: var(--accent);
        font-weight: 600;
        min-width: 34px;
        font-variant-numeric: tabular-nums;
      }
      /* Entry titles take the sheet-title face; the numbers beside them stay
         tabular data, which is why the two are separate spans. */
      .rail-links .t {
        font-family: var(--title);
        font-size: 11.5px;
        letter-spacing: 0.05em;
        color: var(--ink-soft);
      }
      .rail-links a.is-active .t {
        color: var(--ink);
      }
      .rail-top a.rail-out {
        color: var(--ink-soft);
        margin-top: 4px;
      }
      .rail-sec {
        font-family: var(--data);
        font-size: 9px;
        letter-spacing: 0.18em;
        color: var(--ink-faint);
        padding: 14px 16px 5px;
      }
      .rail-top {
        display: flex;
        flex-direction: column;
      }
      .themer {
        margin: 14px 16px 0;
        display: flex;
        gap: 0;
        border: 1px solid var(--ink);
      }
      .themer button {
        flex: 1 1 auto;
        font-family: var(--data);
        font-size: 9px;
        letter-spacing: 0.14em;
        color: var(--ink);
        background: var(--paper);
        border: none;
        border-right: 1px solid var(--line);
        padding: 5px 2px;
        cursor: pointer;
      }
      .themer button:last-child {
        border-right: none;
      }
      .themer button[aria-pressed='true'] {
        background: var(--accent);
        color: var(--paper);
      }
      .content {
        min-width: 0;
        padding: clamp(12px, 2.4vw, 30px);
      }
      .content > .sheet:first-child {
        margin-top: 0;
      }
      a.xref {
        color: var(--accent);
        text-decoration-color: var(--accent-soft);
      }
      .crumb {
        font-family: var(--data);
        font-size: 10px;
        letter-spacing: 0.14em;
        font-variant-numeric: tabular-nums;
        color: var(--ink-soft);
        max-width: 1180px;
        margin: 0 auto 12px;
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
      }
      .crumb a {
        color: var(--ink-soft);
      }
      /* The one fact in the strip, not one link among six. */
      .crumb .sh {
        font-weight: 600;
        color: var(--ink);
      }
      .loading {
        font-family: var(--data);
        font-size: 11.5px;
        letter-spacing: 0.14em;
        color: var(--ink-faint);
        padding: 40px 4px;
      }
      /* Gallery index */
      .gal-body,
      .stat-bar,
      .survey {
        max-width: 1180px;
        margin-left: auto;
        margin-right: auto;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 14px;
        max-width: 1180px;
        margin: 0 auto;
      }
      .card {
        border: 1.5px solid var(--ink);
        background: var(--paper);
        padding: 14px 16px 15px;
        text-decoration: none;
        color: inherit;
        display: block;
      }
      .card:hover {
        background: var(--paper-2);
      }
      .card .n {
        font-family: var(--data);
        font-size: 10px;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.16em;
        color: var(--accent);
      }
      .card h3 {
        font-family: var(--title);
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.1em;
        margin: 5px 0 6px;
      }
      .card p {
        font-family: var(--prose);
        font-size: 14px;
        color: var(--ink-soft);
        margin: 0;
      }
      .card .alt {
        font-family: var(--data);
        font-size: 9px;
        letter-spacing: 0.14em;
        color: var(--ink-faint);
        display: block;
        margin: -2px 0 7px;
      }
      .card .verdict {
        font-family: var(--prose);
        font-size: 13px;
        font-style: italic;
        color: var(--ink-faint);
        margin: 7px 0 0;
      }
      .card .meta {
        font-family: var(--data);
        font-size: 9px;
        letter-spacing: 0.12em;
        color: var(--ink-faint);
        margin-top: 9px;
        display: block;
      }
      .prose {
        max-width: 72ch;
        margin: 0 auto;
      }
      .prose h2 {
        font-family: var(--title);
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.12em;
        margin-bottom: 12px;
      }
      .prose h3 {
        font-family: var(--data);
        font-size: 11px;
        letter-spacing: 0.18em;
        color: var(--ink-soft);
        margin: 22px 0 8px;
      }
      .prose p {
        font-family: var(--prose);
        font-size: 15.5px;
        margin-bottom: 10px;
      }
      .prose code {
        font-family: var(--code);
        font-size: 0.85em;
        background: var(--paper-2);
        border: 1px solid var(--line);
        padding: 0 4px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
