<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="%BASE_URL%" />
    <title>UI-Router for React - lit-ui-router</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        max-width: 800px;
        margin: 32px auto;
        padding: 0 20px;
        color: light-dark(#222, #e6e6e6);
        background: light-dark(#fff, #1d1d1d);
      }
      @media (max-width: 480px) {
        body {
          margin: 16px auto;
          padding: 0 12px;
        }
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-block: 16px;
      }
      nav a {
        padding: 6px 12px;
        border-radius: 4px;
        color: inherit;
        text-decoration: none;
        background: light-dark(#f0f0f0, #2c2c2c);
      }
      nav a[aria-current='page'] {
        background: light-dark(#1f1f1f, #ededed);
        color: light-dark(#fff, #111);
      }
      h1 {
        margin: 0 0 4px;
        font-size: 1.17em;
      }
      h2 {
        margin: 0 0 4px;
        font-size: 1em;
      }
      p {
        margin: 0 0 12px;
      }
      .view {
        min-height: 5.5em;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
