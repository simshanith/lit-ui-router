<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lint-eslint - lit-ui-router Example</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        max-width: 800px;
        margin: 40px auto;
        padding: 0 20px;
      }
      nav {
        margin-bottom: 20px;
      }
      nav a {
        padding: 8px 16px;
        text-decoration: none;
        color: #333;
        border-radius: 4px;
      }
      nav a:hover {
        background: #f0f0f0;
      }
      nav a.active {
        font-weight: bold;
        background: #e0e0e0;
      }
      .tabs {
        display: flex;
        gap: 4px;
        margin-top: 24px;
      }
      .tabs button {
        font: inherit;
        font-size: 13px;
        padding: 6px 12px;
        border: 1px solid #d0d0d0;
        border-radius: 4px 4px 0 0;
        border-bottom: 0;
        background: #f6f6f6;
        cursor: pointer;
      }
      .tabs button.selected {
        background: #fff;
        font-weight: 600;
      }
      lint-report {
        margin-top: 0;
        border-top-left-radius: 0;
      }
      iframe {
        display: block;
        width: 100%;
        height: 420px;
        border: 0;
        background: #fff;
      }
      iframe[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
